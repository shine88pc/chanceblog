<!DOCTYPE html>
<html lang="ko" class="dark" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chance_Blog | 테크 & AI 에세이 노트</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            softbg: { dark: '#0b0f19', light: '#f8fafc' },
            cardbg: { dark: '#161e2e', light: '#ffffff' },
            bordercol: { dark: '#273548', light: '#e2e8f0' },
            textcolor: { dark: '#cbd5e1', light: '#334155' },
            headingcolor: { dark: '#f8fafc', light: '#0f172a' }
          }
        }
      }
    }
  </script>
  <style>
    .prose p { margin-bottom: 1.6em; line-height: 1.9; font-size: 1.05rem; }
    .dark .prose p { color: #cbd5e1; }
    :not(.dark) .prose p { color: #334155; }
    
    .prose h1, .prose h2, .prose h3 { margin-top: 2em; margin-bottom: 0.8em; font-weight: 800; letter-spacing: -0.025em; }
    .dark .prose h1, .dark .prose h2, .dark .prose h3 { color: #f8fafc; }
    :not(.dark) .prose h1, :not(.dark) .prose h2, :not(.dark) .prose h3 { color: #0f172a; }
    
    .prose h1 { font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4em; }
    .prose h2 { font-size: 1.4rem; }
    .prose ul, .prose ol { margin-bottom: 1.5em; padding-left: 1.5em; }
    .prose li { margin-bottom: 0.6em; }
    .prose img { margin: 2em 0; width: 100%; max-height: 420px; object-fit: cover; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); }
    .prose strong { font-weight: 700; }
    .dark .prose strong { color: #f1f5f9; }
    :not(.dark) .prose strong { color: #0f172a; }
    .prose blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; font-style: italic; margin: 1.5em 0; color: #94a3b8; }
  </style>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)] font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white transition-colors duration-300" 
      style="--bg-main:#0b0f19; --card-bg:#161e2e; --border-color:#273548; --text-main:#cbd5e1; --heading:#f8fafc;">

  <!-- Header -->
  <header class="bg-[var(--card-bg)]/80 backdrop-blur-xl border-b border-[var(--border-color)] sticky top-0 z-50 transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="./" class="flex items-center space-x-3 group">
        <div class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center text-white font-black shadow-md group-hover:scale-105 transition">C</div>
        <span class="text-xl font-black bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">Chance_Blog</span>
      </a>
      <div class="flex items-center space-x-3">
        <button onclick="toggleTheme()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-[var(--card-bg)] border border-[var(--border-color)] transition" title="테마 전환">
          <i id="theme-icon" class="fas fa-moon"></i>
        </button>
        <a href="./feed.xml" target="_blank" class="text-slate-400 hover:text-white p-2 rounded-xl bg-[var(--card-bg)] border border-[var(--border-color)] transition" title="RSS 피드">
          <i class="fas fa-rss"></i>
        </a>
        <a href="[https://github.com/shine88pc/chanceblog](https://github.com/shine88pc/chanceblog)" target="_blank" class="text-slate-400 hover:text-white p-2 rounded-xl bg-[var(--card-bg)] border border-[var(--border-color)] transition" title="GitHub Repository">
          <i class="fab fa-github"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Profile Banner -->
  <section class="border-b border-[var(--border-color)] bg-gradient-to-b from-slate-900/40 to-[var(--bg-main)] py-12 transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center gap-6">
      <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white text-3xl font-black shadow-xl shadow-indigo-500/10 shrink-0 border border-indigo-400/20">
        C
      </div>
      <div class="text-center sm:text-left space-y-1">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[var(--heading)] tracking-tight">기술과 일상을 기록하는 공간 👋</h1>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed">급변하는 AI 트렌드와 개발 인사이트를 깊이 있는 에세이 형식으로 풀어냅니다.</p>
      </div>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Post List & Article Detail -->
    <div class="lg:col-span-2 space-y-6" id="app-content">
      
      <!-- Search Bar & Title Header -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-[var(--border-color)] pb-4">
        <h2 class="text-lg font-bold text-[var(--heading)] flex items-center gap-2.5 w-full sm:w-auto" id="current-category-title">
          <i class="fas fa-feather-alt text-indigo-400"></i> 최근 작성한 글
        </h2>
        <div class="relative w-full sm:w-64">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i class="fas fa-search text-xs"></i>
          </span>
          <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="포스트 검색..." 
                 class="w-full pl-9 pr-4 py-1.5 text-xs bg-[var(--card-bg)] border border-[var(--border-color)] rounded-xl text-[var(--text-main)] focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>

      <!-- [AD SLOT - HEADER] -->
      <div id="ad-slot-header" class="hidden"></div>

      <!-- Article Cards Container -->
      <div id="post-list" class="space-y-5">
        <div class="py-16 text-center text-slate-500">
          <i class="fas fa-spinner fa-spin text-3xl mb-3 text-indigo-500"></i>
          <p>포스트를 불러오는 중입니다...</p>
        </div>
      </div>

      <!-- Post Detail Content View -->
      <div id="post-detail" class="hidden bg-[var(--card-bg)] p-6 sm:p-10 rounded-3xl shadow-2xl border border-[var(--border-color)] space-y-6 transition-colors duration-300">
        <div class="flex items-center justify-between pb-4 border-b border-[var(--border-color)]">
          <button onclick="closePost()" class="inline-flex items-center gap-2 text-sm font-semibold text-indigo-400 hover:text-indigo-300 transition">
            <i class="fas fa-arrow-left"></i> 목록으로 돌아가기
          </button>
          <button onclick="copyPostLink()" class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-400 hover:text-white bg-[var(--bg-main)] border border-[var(--border-color)] px-3 py-1.5 rounded-xl transition">
            <i class="fas fa-link"></i> 링크 복사
          </button>
        </div>
        
        <!-- SEO Tags Container -->
        <div id="post-tags-container" class="flex flex-wrap gap-2 pt-2"></div>

        <article id="markdown-body" class="prose max-w-none pt-2"></article>

        <!-- Social Share Buttons -->
        <div class="flex flex-wrap items-center gap-2 pt-4 border-t border-[var(--border-color)]">
          <span class="text-xs text-slate-400 font-semibold mr-2">소셜 공유:</span>
          <button onclick="shareSNS('twitter')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-xl transition"><i class="fab fa-twitter"></i> X (Twitter)</button>
          <button onclick="shareSNS('facebook')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-xl transition"><i class="fab fa-facebook"></i> Facebook</button>
          <button onclick="shareSNS('linkedin')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-xl transition"><i class="fab fa-linkedin"></i> LinkedIn</button>
        </div>

        <!-- [COMMENT SLOT] (추후 Giscus / Utterances 댓글 위젯 연동용 슬롯) -->
        <div id="comment-slot" class="pt-6 border-t border-[var(--border-color)]">
          <div class="p-6 bg-[var(--bg-main)] rounded-2xl border border-[var(--border-color)] text-center text-slate-500 text-xs">
            <i class="far fa-comments mb-2 text-base text-indigo-400"></i>
            <p>독자 소통 공간 (GitHub Discussions 연동 슬롯)</p>
          </div>
        </div>

        <!-- [AD SLOT - FOOTER] -->
        <div id="ad-slot-footer" class="pt-6 border-t border-[var(--border-color)] text-center text-xs text-slate-500"></div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="space-y-6">
      <div class="bg-[var(--card-bg)] p-6 rounded-3xl border border-[var(--border-color)] shadow-lg transition-colors duration-300">
        <h3 class="font-bold text-[var(--heading)] text-xs uppercase tracking-wider mb-4 flex items-center gap-2 text-indigo-400">
          <i class="fas fa-bookmark"></i> 카테고리 탐색
        </h3>
        <div class="space-y-4 text-sm">
          <button onclick="filterCategory('ALL')" class="w-full text-left font-bold text-indigo-400 hover:text-indigo-300 py-2.5 px-3.5 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 transition flex justify-between items-center group">
            <span><i class="fas fa-th-large mr-2"></i> 전체 글 보기</span>
            <span id="total-count-badge" class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full font-bold">0</span>
          </button>
          <div>
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 px-1">🇰🇷 한글 에세이</p>
            <ul class="space-y-1.5 text-[var(--text-main)]" id="kr-categories"></ul>
          </div>
          <div class="pt-4 border-t border-[var(--border-color)]">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 px-1">🇺🇸 English Articles</p>
            <ul class="space-y-1.5 text-[var(--text-main)]" id="en-categories"></ul>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="bg-[var(--card-bg)] border-t border-[var(--border-color)] py-8 text-center text-xs text-slate-400 mt-auto transition-colors duration-300">
    <p>© 2026 Chance_Blog. All rights reserved. Powered by GitHub Actions & Gemini API.</p>
  </footer>

  <script>
    const USER = 'shine88pc';
    const REPO = 'chanceblog';
    const POSTS_DIR = '_posts';

    let allPostsData = [];
    let currentFilteredPosts = [];

    function toggleTheme() {
      const html = document.getElementById('html-root');
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.className = 'fas fa-sun';
        localStorage.setItem('theme', 'light');
        applyThemeVariables('light');
      } else {
        html.classList.add('dark');
        icon.className = 'fas fa-moon';
        localStorage.setItem('theme', 'dark');
        applyThemeVariables('dark');
      }
    }

    function applyThemeVariables(theme) {
      const root = document.body;
      if (theme === 'light') {
        root.style.setProperty('--bg-main', '#f8fafc');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--border-color', '#e2e8f0');
        root.style.setProperty('--text-main', '#334155');
        root.style.setProperty('--heading', '#0f172a');
      } else {
        root.style.setProperty('--bg-main', '#0b0f19');
        root.style.setProperty('--card-bg', '#161e2e');
        root.style.setProperty('--border-color', '#273548');
        root.style.setProperty('--text-main', '#cbd5e1');
        root.style.setProperty('--heading', '#f8fafc');
      }
    }

    if (localStorage.getItem('theme') === 'light') {
      document.getElementById('html-root').classList.remove('dark');
      document.getElementById('theme-icon').className = 'fas fa-sun';
      applyThemeVariables('light');
    }

    function calculateReadingTime(text) {
      const words = text.trim().split(/\s+/).length;
      const minutes = Math.ceil(words / 200);
      return `약 ${minutes}분 소요`;
    }

    async function fetchPostList() {
      try {
        const res = await fetch(`[https://api.github.com/repos/$](https://api.github.com/repos/$){USER}/${REPO}/contents/${POSTS_DIR}`);
        if(!res.ok) throw new Error('Posts folder not found');
        const files = await res.json();
        
        const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
        
        allPostsData = await Promise.all(mdFiles.map(async (file) => {
          const contentRes = await fetch(file.download_url);
          const rawText = await contentRes.text();
          
          let title = file.name;
          let category = file.name.includes('-KR-') ? 'KR - 생각정리' : 'EN - Reflections';
          let lang = file.name.includes('-KR-') ? 'kr' : 'en';
          let image = '[https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80](https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80)';
          let tags = [];

          const frontmatterMatch = rawText.match(/^---[\s\S]*?---/);
          if (frontmatterMatch) {
            const fm = frontmatterMatch[0];
            const titleMatch = fm.match(/title:\s*"(.*?)"/);
            const catMatch = fm.match(/category:\s*"(.*?)"/);
            const langMatch = fm.match(/lang:\s*(kr|en)/);
            const imgMatch = fm.match(/image:\s*"(.*?)"/);
            const tagsMatch = fm.match(/tags:\s*\[(.*?)\]/);
            
            if (titleMatch) title = titleMatch[1];
            if (catMatch) category = catMatch[1];
            if (langMatch) lang = langMatch[1];
            if (imgMatch) image = imgMatch[1];
            if (tagsMatch) {
              tags = tagsMatch[1].split(',').map(t => t.trim().replace(/['"]/g, ''));
            }
          }

          const readingTime = calculateReadingTime(rawText);
          return { file, title, category, lang, image, rawText, readingTime, tags };
        }));

        currentFilteredPosts = allPostsData;
        document.getElementById('total-count-badge').innerText = allPostsData.length;
        renderCategories();
        renderPostList(allPostsData);

      } catch (err) {
        console.error(err);
        document.getElementById('post-list').innerHTML = `<div class="py-12 text-center text-red-400">포스트를 불러오는 중 오류가 발생했습니다.</div>`;
      }
    }

    function renderCategories() {
      const krCats = {};
      const enCats = {};

      allPostsData.forEach(p => {
        if (p.lang === 'kr' || p.category.startsWith('KR')) {
          krCats[p.category] = (krCats[p.category] || 0) + 1;
        } else {
          enCats[p.category] = (enCats[p.category] || 0) + 1;
        }
      });

      const krUl = document.getElementById('kr-categories');
      krUl.innerHTML = '';
      for (const [cat, count] of Object.entries(krCats)) {
        krUl.innerHTML += `<li onclick="filterCategory('${cat}')" class="cursor-pointer hover:text-indigo-400 py-1.5 px-2.5 rounded-xl hover:bg-indigo-500/10 transition flex items-center justify-between text-xs"><span>▪ ${cat}</span> <span class="bg-[var(--bg-main)] text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-semibold">${count}</span></li>`;
      }

      const enUl = document.getElementById('en-categories');
      enUl.innerHTML = '';
      for (const [cat, count] of Object.entries(enCats)) {
        enUl.innerHTML += `<li onclick="filterCategory('${cat}')" class="cursor-pointer hover:text-indigo-400 py-1.5 px-2.5 rounded-xl hover:bg-indigo-500/10 transition flex items-center justify-between text-xs"><span>▪ ${cat}</span> <span class="bg-[var(--bg-main)] text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-semibold">${count}</span></li>`;
      }
    }

    function renderPostList(posts) {
      document.getElementById('post-count').innerText = `총 ${posts.length}개의 포스트`;
      const container = document.getElementById('post-list');
      container.innerHTML = '';

      if (posts.length === 0) {
        container.innerHTML = `<div class="py-12 text-center text-slate-500">검색 결과가 없습니다.</div>`;
        return;
      }

      posts.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-[var(--card-bg)] rounded-3xl border border-[var(--border-color)] hover:border-indigo-500/50 hover:shadow-xl transition cursor-pointer overflow-hidden flex flex-col sm:flex-row group";
        
        const langBadge = p.lang === 'kr' 
          ? '<span class="bg-red-500/10 text-red-400 border border-red-500/20 text-[11px] px-2.5 py-0.5 rounded-full font-bold">KOREAN</span>' 
          : '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[11px] px-2.5 py-0.5 rounded-full font-bold">ENGLISH</span>';

        card.innerHTML = `
          <div class="sm:w-1/3 h-48 sm:h-auto shrink-0 overflow-hidden relative">
            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          </div>
          <div class="p-6 flex flex-col justify-between flex-1">
            <div>
              <div class="flex items-center justify-between mb-3">
                ${langBadge}
                <span class="text-slate-400 text-xs">${p.category}</span>
              </div>
              <h3 class="font-bold text-[var(--heading)] text-lg leading-snug group-hover:text-indigo-400 transition mb-2">${p.title}</h3>
            </div>
            <div class="mt-4 pt-3 border-t border-[var(--border-color)] flex items-center justify-between text-xs text-slate-400">
              <span class="flex items-center gap-1.5"><i class="far fa-clock"></i> ${p.readingTime}</span>
              <span class="text-indigo-400 font-semibold flex items-center gap-1 group-hover:translate-x-1 transition">읽기 <i class="fas fa-chevron-right text-[10px]"></i></span>
            </div>
          </div>
        `;
        card.onclick = () => loadPostContent(p);
        container.appendChild(card);
      });
    }

    function filterCategory(cat) {
      document.getElementById('current-category-title').innerText = cat === 'ALL' ? ' 최근 작성한 글' : ` ${cat}`;
      if (cat === 'ALL') {
        currentFilteredPosts = allPostsData;
      } else {
        currentFilteredPosts = allPostsData.filter(p => p.category === cat);
      }
      renderPostList(currentFilteredPosts);
    }

    function handleSearch(query) {
      const keyword = query.toLowerCase().trim();
      if (!keyword) {
        renderPostList(currentFilteredPosts);
        return;
      }
      const searched = currentFilteredPosts.filter(p => 
        p.title.toLowerCase().includes(keyword) || p.rawText.toLowerCase().includes(keyword)
      );
      renderPostList(searched);
    }

    function loadPostContent(post) {
      let text = post.rawText.replace(/^---[\s\S]*?---/, '');
      document.getElementById('post-list').classList.add('hidden');
      const detailView = document.getElementById('post-detail');
      detailView.classList.remove('hidden');
      
      const tagsContainer = document.getElementById('post-tags-container');
      tagsContainer.innerHTML = '';
      if (post.tags && post.tags.length > 0) {
        post.tags.forEach(tag => {
          const tagBadge = document.createElement('span');
          tagBadge.className = "bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs px-3 py-1 rounded-full font-medium";
          tagBadge.innerText = `#${tag}`;
          tagsContainer.appendChild(tagBadge);
        });
      }

      document.getElementById('markdown-body').innerHTML = marked.parse(text);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePost() {
      document.getElementById('post-detail').classList.add('hidden');
      document.getElementById('post-list').classList.remove('hidden');
    }

    function copyPostLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('블로그 링크가 클립보드에 복사되었습니다!');
      });
    }

    function shareSNS(platform) {
      const url = encodeURIComponent(window.location.href);
      const text = encodeURIComponent(document.title);
      let shareUrl = '';
      if (platform === 'twitter') {
        shareUrl = `[https://twitter.com/intent/tweet?url=$](https://twitter.com/intent/tweet?url=$){url}&text=${text}`;
      } else if (platform === 'facebook') {
        shareUrl = `[https://www.facebook.com/sharer/sharer.php?u=$](https://www.facebook.com/sharer/sharer.php?u=$){url}`;
      } else if (platform === 'linkedin') {
        shareUrl = `[https://www.linkedin.com/sharing/share-offsite/?url=$](https://www.linkedin.com/sharing/share-offsite/?url=$){url}`;
      }
      if (shareUrl) window.open(shareUrl, '_blank', 'width=600,height=400');
    }

    fetchPostList();
  </script>
</body>
</html>
