<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chance_Blog | 테크 & AI 에세이 노트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            softbg: '#0b0f19',
            cardbg: '#161e2e',
            bordercol: '#273548',
            accent: '#6366f1'
          }
        }
      }
    }
  </script>
  <style>
    .prose p { margin-bottom: 1.6em; line-height: 1.9; color: #cbd5e1; font-size: 1.05rem; }
    .prose h1, .prose h2, .prose h3 { color: #f8fafc; margin-top: 2em; margin-bottom: 0.8em; font-weight: 800; letter-spacing: -0.025em; }
    .prose h1 { font-size: 1.8rem; border-bottom: 1px solid #273548; padding-bottom: 0.4em; }
    .prose h2 { font-size: 1.4rem; }
    .prose ul, .prose ol { margin-bottom: 1.5em; padding-left: 1.5em; color: #cbd5e1; }
    .prose li { margin-bottom: 0.6em; }
    .prose img { margin: 2em 0; border: 1px solid #273548; width: 100%; max-height: 420px; object-fit: cover; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    .prose strong { color: #f1f5f9; font-weight: 700; }
    .prose blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; color: #94a3b8; font-style: italic; margin: 1.5em 0; }
  </style>
</head>
<body class="bg-softbg text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="bg-cardbg/80 backdrop-blur-xl border-b border-bordercol sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="./" class="flex items-center space-x-3 group">
        <div class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center text-white font-black shadow-md group-hover:scale-105 transition">C</div>
        <span class="text-xl font-black bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">Chance_Blog</span>
      </a>
      <nav class="flex items-center space-x-4">
        <a href="https://github.com/shine88pc/chanceblog" target="_blank" class="text-slate-400 hover:text-white transition p-2 rounded-lg hover:bg-slate-800" title="GitHub Repository">
          <i class="fab fa-github text-xl"></i>
        </a>
      </nav>
    </div>
  </header>

  <!-- Hero Profile Banner -->
  <section class="border-b border-bordercol bg-gradient-to-b from-slate-900/60 to-softbg py-12">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center gap-6">
      <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white text-3xl font-black shadow-xl shadow-indigo-500/10 shrink-0 border border-indigo-400/20">
        C
      </div>
      <div class="text-center sm:text-left space-y-1">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">기술과 일상을 기록하는 공간 👋</h1>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed">급변하는 AI 트렌드와 개발 인사이트를 깊이 있는 에세이 형식으로 풀어냅니다.</p>
      </div>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Post List & Article Detail -->
    <div class="lg:col-span-2 space-y-6" id="app-content">
      <div class="flex items-center justify-between border-b border-bordercol pb-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2.5" id="current-category-title">
          <i class="fas fa-feather-alt text-indigo-400"></i> 최근 작성한 글
        </h2>
        <span id="post-count" class="text-xs text-slate-400 font-medium bg-cardbg px-3 py-1 rounded-full border border-bordercol">로딩 중...</span>
      </div>

      <!-- Article Cards Container -->
      <div id="post-list" class="space-y-5">
        <div class="py-16 text-center text-slate-500">
          <i class="fas fa-spinner fa-spin text-3xl mb-3 text-indigo-500"></i>
          <p>포스트를 불러오는 중입니다...</p>
        </div>
      </div>

      <!-- Post Detail Content View -->
      <div id="post-detail" class="hidden bg-cardbg p-6 sm:p-10 rounded-3xl shadow-2xl border border-bordercol space-y-6">
        <div class="flex items-center justify-between pb-4 border-b border-bordercol">
          <button onclick="closePost()" class="inline-flex items-center gap-2 text-sm font-semibold text-indigo-400 hover:text-indigo-300 transition">
            <i class="fas fa-arrow-left"></i> 목록으로 돌아가기
          </button>
          <button onclick="copyPostLink()" class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-800 border border-bordercol px-3 py-1.5 rounded-xl transition">
            <i class="fas fa-link"></i> 링크 복사
          </button>
        </div>
        <article id="markdown-body" class="prose max-w-none pt-2"></article>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="space-y-6">
      <div class="bg-cardbg p-6 rounded-3xl border border-bordercol shadow-lg">
        <h3 class="font-bold text-white text-xs uppercase tracking-wider mb-4 flex items-center gap-2 text-indigo-300">
          <i class="fas fa-bookmark"></i> 카테고리 탐색
        </h3>
        <div class="space-y-4 text-sm">
          <button onclick="filterCategory('ALL')" class="w-full text-left font-bold text-indigo-400 hover:text-indigo-300 py-2.5 px-3.5 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 transition flex justify-between items-center group">
            <span><i class="fas fa-th-large mr-2"></i> 전체 글 보기</span>
            <span id="total-count-badge" class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full font-bold">0</span>
          </button>
          <div>
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 px-1">🇰🇷 한글 에세이</p>
            <ul class="space-y-1.5 text-slate-300" id="kr-categories"></ul>
          </div>
          <div class="pt-4 border-t border-bordercol">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 px-1">🇺🇸 English Articles</p>
            <ul class="space-y-1.5 text-slate-300" id="en-categories"></ul>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="bg-cardbg border-t border-bordercol py-8 text-center text-xs text-slate-400 mt-auto">
    <p>© 2026 Chance_Blog. All rights reserved. Powered by GitHub Actions & Gemini API.</p>
  </footer>

  <script>
    const USER = 'shine88pc';
    const REPO = 'chanceblog';
    const POSTS_DIR = '_posts';

    let allPostsData = [];

    function calculateReadingTime(text) {
      const words = text.trim().split(/\s+/).length;
      const minutes = Math.ceil(words / 200);
      return `약 ${minutes}분 소요`;
    }

    async function fetchPostList() {
      try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${POSTS_DIR}`);
        if(!res.ok) throw new Error('Posts folder not found');
        const files = await res.json();
        
        const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
        
        allPostsData = await Promise.all(mdFiles.map(async (file) => {
          const contentRes = await fetch(file.download_url);
          const rawText = await contentRes.text();
          
          let title = file.name;
          let category = file.name.includes('-KR-') ? 'KR - 생각정리' : 'EN - Reflections';
          let lang = file.name.includes('-KR-') ? 'kr' : 'en';
          let image = 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80';

          const frontmatterMatch = rawText.match(/^---[\s\S]*?---/);
          if (frontmatterMatch) {
            const fm = frontmatterMatch[0];
            const titleMatch = fm.match(/title:\s*"(.*?)"/);
            const catMatch = fm.match(/category:\s*"(.*?)"/);
            const langMatch = fm.match(/lang:\s*(kr|en)/);
            const imgMatch = fm.match(/image:\s*"(.*?)"/);
            if (titleMatch) title = titleMatch[1];
            if (catMatch) category = catMatch[1];
            if (langMatch) lang = langMatch[1];
            if (imgMatch) image = imgMatch[1];
          }

          const readingTime = calculateReadingTime(rawText);
          return { file, title, category, lang, image, rawText, readingTime };
        }));

        document.getElementById('total-count-badge').innerText = allPostsData.length;
        renderCategories();
        renderPostList(allPostsData);

      } catch (err) {
        console.error(err);
        document.getElementById('post-list').innerHTML = `<div class="py-12 text-center text-red-400">포스트를 불러오는 중 오류가 발생했습니다.</div>`;
      }
    }

    function renderCategories() {
      const krCats = {};
      const enCats = {};

      allPostsData.forEach(p => {
        if (p.lang === 'kr' || p.category.startsWith('KR')) {
          krCats[p.category] = (krCats[p.category] || 0) + 1;
        } else {
          enCats[p.category] = (enCats[p.category] || 0) + 1;
        }
      });

      const krUl = document.getElementById('kr-categories');
      krUl.innerHTML = '';
      for (const [cat, count] of Object.entries(krCats)) {
        krUl.innerHTML += `<li onclick="filterCategory('${cat}')" class="cursor-pointer hover:text-white py-1.5 px-2.5 rounded-xl hover:bg-slate-800/80 transition flex items-center justify-between text-xs"><span>▪ ${cat}</span> <span class="bg-slate-800 text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-semibold">${count}</span></li>`;
      }

      const enUl = document.getElementById('en-categories');
      enUl.innerHTML = '';
      for (const [cat, count] of Object.entries(enCats)) {
        enUl.innerHTML += `<li onclick="filterCategory('${cat}')" class="cursor-pointer hover:text-white py-1.5 px-2.5 rounded-xl hover:bg-slate-800/80 transition flex items-center justify-between text-xs"><span>▪ ${cat}</span> <span class="bg-slate-800 text-slate-400 text-[10px] px-2 py-0.5 rounded-full font-semibold">${count}</span></li>`;
      }
    }

    function renderPostList(posts) {
      document.getElementById('post-count').innerText = `총 ${posts.length}개의 포스트`;
      const container = document.getElementById('post-list');
      container.innerHTML = '';

      if (posts.length === 0) {
        container.innerHTML = `<div class="py-12 text-center text-slate-500">해당 카테고리에 등록된 글이 없습니다.</div>`;
        return;
      }

      posts.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-cardbg rounded-3xl border border-bordercol hover:border-indigo-500/50 hover:shadow-xl transition cursor-pointer overflow-hidden flex flex-col sm:flex-row group";
        
        const langBadge = p.lang === 'kr' 
          ? '<span class="bg-red-500/10 text-red-400 border border-red-500/20 text-[11px] px-2.5 py-0.5 rounded-full font-bold">KOREAN</span>' 
          : '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[11px] px-2.5 py-0.5 rounded-full font-bold">ENGLISH</span>';

        card.innerHTML = `
          <div class="sm:w-1/3 h-48 sm:h-auto shrink-0 overflow-hidden relative">
            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          </div>
          <div class="p-6 flex flex-col justify-between flex-1">
            <div>
              <div class="flex items-center justify-between mb-3">
                ${langBadge}
                <span class="text-slate-400 text-xs">${p.category}</span>
              </div>
              <h3 class="font-bold text-white text-lg leading-snug group-hover:text-indigo-300 transition mb-2">${p.title}</h3>
            </div>
            <div class="mt-4 pt-3 border-t border-bordercol/60 flex items-center justify-between text-xs text-slate-400">
              <span class="flex items-center gap-1.5"><i class="far fa-clock"></i> ${p.readingTime}</span>
              <span class="text-indigo-400 font-semibold flex items-center gap-1 group-hover:translate-x-1 transition">읽기 <i class="fas fa-chevron-right text-[10px]"></i></span>
            </div>
          </div>
        `;
        card.onclick = () => loadPostContent(p);
        container.appendChild(card);
      });
    }

    function filterCategory(cat) {
      document.getElementById('current-category-title').innerText = cat === 'ALL' ? ' 최근 작성한 글' : ` ${cat}`;
      if (cat === 'ALL') {
        renderPostList(allPostsData);
      } else {
        const filtered = allPostsData.filter(p => p.category === cat);
        renderPostList(filtered);
      }
    }

    function loadPostContent(post) {
      let text = post.rawText.replace(/^---[\s\S]*?---/, '');
      document.getElementById('post-list').classList.add('hidden');
      const detailView = document.getElementById('post-detail');
      detailView.classList.remove('hidden');
      
      document.getElementById('markdown-body').innerHTML = marked.parse(text);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePost() {
      document.getElementById('post-detail').classList.add('hidden');
      document.getElementById('post-list').classList.remove('hidden');
    }

    function copyPostLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('블로그 링크가 클립보드에 복사되었습니다!');
      });
    }

    fetchPostList();
  </script>
</body>
</html>
