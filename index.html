<!DOCTYPE html>
<html lang="ko" class="dark" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chance_Blog | 테크 & AI 에세이 노트</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706'
            }
          }
        }
      }
    }
  </script>
  <style>
    .markdown-body h1 { font-size: 1.875rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 1rem; }
    .markdown-body h2 { font-size: 1.5rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.75rem; }
    .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
    .markdown-body p { margin-bottom: 1rem; line-height: 1.75; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
    .markdown-body li { margin-bottom: 0.25rem; }
    .markdown-body blockquote { border-left: 4px solid #f59e0b; padding-left: 1rem; font-style: italic; margin-bottom: 1rem; color: #a1a1aa; }
    .markdown-body code { background-color: rgba(255, 255, 255, 0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875em; }
    .markdown-body pre { background-color: #18181b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #27272a; }
    .markdown-body pre code { background-color: transparent; padding: 0; }
    .markdown-body img { border-radius: 0.75rem; max-width: 100%; height: auto; margin: 1.5rem 0; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Top Header -->
  <header class="sticky top-0 z-40 w-full backdrop-blur-md bg-zinc-950/80 border-b border-zinc-800/80 transition-colors duration-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Header Logo with ⚡ -->
      <a href="#" onclick="resetFilter(); return false;" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-300 flex items-center justify-center text-xl shadow-lg shadow-yellow-500/20 group-hover:scale-105 transition-transform duration-200">
          <span class="select-none">⚡</span>
        </div>
        <div class="flex items-center">
          <span class="text-xl font-black tracking-tight text-white group-hover:text-yellow-400 transition-colors">Chance<span class="text-yellow-400">_</span>Blog</span>
          <span class="hidden sm:inline-block text-[11px] px-2 py-0.5 ml-2.5 font-semibold rounded-full bg-yellow-400/10 text-yellow-400 border border-yellow-400/25 tracking-wide">TECH & AI</span>
        </div>
      </a>

      <!-- Nav & Utility Actions -->
      <div class="flex items-center space-x-3">
        <a href="https://github.com/shine88pc/chanceblog" target="_blank" rel="noopener noreferrer" class="p-2 text-zinc-400 hover:text-white transition-colors">
          <i class="fa-brands fa-github text-lg"></i>
        </a>
        <button id="theme-toggle" onclick="toggleTheme()" class="p-2 text-zinc-400 hover:text-yellow-400 transition-colors rounded-lg bg-zinc-900 border border-zinc-800">
          <i id="theme-icon" class="fa-solid fa-moon text-base"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner with ⚡ -->
  <section class="relative py-16 sm:py-20 px-4 overflow-hidden border-b border-zinc-800/80 bg-gradient-to-b from-zinc-900/70 via-zinc-950 to-zinc-950">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-yellow-500/10 via-transparent to-transparent pointer-events-none"></div>
    <div class="max-w-4xl mx-auto text-center relative z-10">
      <!-- Hero Lightning Icon Badge -->
      <div class="inline-flex items-center justify-center mb-6">
        <div class="relative group cursor-pointer" onclick="resetFilter()">
          <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-yellow-400 to-amber-500 opacity-60 blur-lg group-hover:opacity-100 transition-opacity duration-300"></div>
          <div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-zinc-900 border border-yellow-400/40 flex items-center justify-center text-4xl sm:text-5xl shadow-2xl transition-transform duration-200 group-hover:scale-105">
            <span class="select-none">⚡</span>
          </div>
        </div>
      </div>
      
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-yellow-400/10 border border-yellow-400/25 text-yellow-400 text-xs sm:text-sm font-semibold mb-4">
        <span>⚡ Real-Time Tech & AI Insight Engine</span>
      </div>
      
      <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white mb-4">
        기술과 생각의 스파크, <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-yellow-500">Chance_Blog</span>
      </h1>
      <p class="max-w-xl mx-auto text-sm sm:text-base text-zinc-400 leading-relaxed">
        AI가 글로벌 테크 이슈, 미래 컴퓨팅, 정책 담론을 실시간 분석하고 기록하는 1인 풀오토 인사이트 노트
      </p>
    </div>
  </section>

  <!-- Main Content Area -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
    <!-- Search & Filter Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <!-- Category Buttons -->
      <div class="flex flex-wrap gap-2" id="category-filters">
        <button onclick="filterCategory('ALL')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-yellow-400 text-zinc-950 font-semibold shadow-sm transition-all" data-cat="ALL">전체보기</button>
        <button onclick="filterCategory('KR')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-zinc-900 text-zinc-300 hover:text-white border border-zinc-800 hover:border-zinc-700 transition-all" data-cat="KR">🇰🇷 한국어</button>
        <button onclick="filterCategory('EN')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-zinc-900 text-zinc-300 hover:text-white border border-zinc-800 hover:border-zinc-700 transition-all" data-cat="EN">🌐 English</button>
      </div>

      <!-- Search Input -->
      <div class="relative max-w-xs w-full">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="제목 또는 태그 검색..." class="w-full pl-9 pr-4 py-1.5 text-xs sm:text-sm bg-zinc-900 border border-zinc-800 rounded-xl text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-yellow-400/50 transition-colors" />
      </div>
    </div>

    <!-- Posts Grid -->
    <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
      <!-- Loading Placeholder -->
      <div class="col-span-full py-16 text-center text-zinc-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3 text-yellow-400"></i>
        <p class="text-sm">포스트를 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <!-- Article Modal -->
  <div id="post-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto" onclick="closeModal(event)">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden my-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between p-4 sm:p-6 border-b border-zinc-800 bg-zinc-950/60">
        <span id="modal-category" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-yellow-400/10 text-yellow-400 border border-yellow-400/20"></span>
        <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800 transition-colors">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="p-6 sm:p-8 overflow-y-auto space-y-4">
        <h2 id="modal-title" class="text-2xl sm:text-3xl font-extrabold text-white leading-tight"></h2>
        <div class="flex items-center gap-3 text-xs text-zinc-400 pb-2 border-b border-zinc-800/60">
          <span id="modal-date"><i class="fa-regular fa-clock mr-1"></i></span>
          <span id="modal-lang"><i class="fa-solid fa-globe mr-1"></i></span>
        </div>
        <div id="modal-image-container" class="hidden rounded-xl overflow-hidden border border-zinc-800">
          <img id="modal-image" src="" alt="" class="w-full max-h-80 object-cover" />
        </div>
        <div id="modal-content" class="markdown-body text-zinc-300 text-sm sm:text-base"></div>
        <div id="modal-tags" class="flex flex-wrap gap-1.5 pt-4 border-t border-zinc-800"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-zinc-800/80 bg-zinc-950 py-8 px-4 text-center text-xs text-zinc-500">
    <div class="flex items-center justify-center gap-2 mb-2">
      <span class="text-yellow-400 font-bold text-sm">⚡ Chance_Blog</span>
      <span>&bull;</span>
      <span>Full-Auto Tech Journal</span>
    </div>
    <p>&copy; 2026 Chance. Powered by Gemini AI & GitHub Actions.</p>
  </footer>

  <script>
    let posts = [];
    let currentCategory = 'ALL';
    let currentQuery = '';

    const fallbackPosts = [
      "_posts/KR - 테크 이야기/2026-10-18-KR-233513.md",
      "_posts/EN - Space & Robotics/2026-10-18-EN-233513.md",
      "_posts/2026-10-18-KR-225949.md",
      "_posts/2026-10-18-EN-225949.md"
    ];

    function parseFrontMatter(text) {
      const fmRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
      const match = text.match(fmRegex);
      if (!match) return { meta: {}, content: text };
      const yaml = match[1];
      const content = match[2];
      const meta = {};
      yaml.split(/\r?\n/).forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.slice(0, colonIdx).trim();
          let val = line.slice(colonIdx + 1).trim();
          if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
            val = val.slice(1, -1);
          } else if (val.startsWith('[') && val.endsWith(']')) {
            try {
              val = JSON.parse(val.replace(/'/g, '"'));
            } catch (e) {
              val = val.slice(1, -1).split(',').map(s => s.trim().replace(/['"]/g, ''));
            }
          }
          meta[key] = val;
        }
      });
      return { meta, content };
    }

    async function loadPosts() {
      let postPaths = [];
      try {
        const res = await fetch('https://api.github.com/repos/shine88pc/chanceblog/git/trees/main?recursive=1');
        if (res.ok) {
          const data = await res.json();
          postPaths = data.tree
            .filter(item => item.path.startsWith('_posts/') && item.path.endsWith('.md'))
            .map(item => item.path);
        }
      } catch (e) {
        console.warn('GitHub API failed, using fallback list', e);
      }

      if (!postPaths || postPaths.length === 0) {
        postPaths = fallbackPosts;
      }

      const loadedPosts = await Promise.all(
        postPaths.map(async (path) => {
          try {
            const r = await fetch(encodeURI(path));
            if (!r.ok) return null;
            const rawText = await r.text();
            const { meta, content } = parseFrontMatter(rawText);
            const filename = path.split('/').pop().replace('.md', '');
            const dateMatch = filename.match(/^(\d{4}-\d{2}-\d{2})/);
            const date = dateMatch ? dateMatch[1] : (meta.date || '2026-10-18');
            return {
              path,
              title: meta.title || filename,
              category: meta.category || 'Tech',
              tags: Array.isArray(meta.tags) ? meta.tags : [],
              lang: meta.lang || (path.includes('KR') ? 'kr' : 'en'),
              image: meta.image || '',
              date,
              content
            };
          } catch (err) {
            return null;
          }
        })
      );

      posts = loadedPosts.filter(Boolean).sort((a, b) => b.date.localeCompare(a.date));
      renderPosts();
    }

    function renderPosts() {
      const container = document.getElementById('posts-grid');
      let filtered = posts.filter(post => {
        const matchCat = currentCategory === 'ALL' 
          || (currentCategory === 'KR' && post.lang === 'kr')
          || (currentCategory === 'EN' && post.lang === 'en');
        
        const q = currentQuery.toLowerCase();
        const matchQuery = !q 
          || post.title.toLowerCase().includes(q)
          || (post.tags && post.tags.some(t => t.toLowerCase().includes(q)))
          || post.category.toLowerCase().includes(q);
        
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-zinc-500">
            <span class="text-3xl block mb-2">⚡</span>
            <p class="text-sm">검색 결과 또는 등록된 포스트가 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((post, index) => {
        const tagBadges = (post.tags || []).slice(0, 3).map(tag => 
          `<span class="text-[11px] font-medium text-zinc-400 bg-zinc-800/80 px-2 py-0.5 rounded">#${tag}</span>`
        ).join(' ');

        const thumbImg = post.image 
          ? `<div class="h-44 w-full overflow-hidden border-b border-zinc-800">
               <img src="${post.image}" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
             </div>`
          : `<div class="h-24 w-full bg-gradient-to-r from-zinc-900 to-zinc-800 flex items-center justify-end px-6 border-b border-zinc-800/60">
               <span class="text-3xl opacity-20">⚡</span>
             </div>`;

        return `
          <article onclick="openPostModal(${index})" class="group bg-zinc-900 border border-zinc-800 hover:border-yellow-400/50 rounded-2xl overflow-hidden cursor-pointer shadow-lg hover:shadow-yellow-500/5 transition-all duration-200 flex flex-col justify-between">
            <div>
              ${thumbImg}
              <div class="p-5 sm:p-6">
                <div class="flex items-center justify-between gap-2 mb-2.5">
                  <span class="text-xs font-bold text-yellow-400 px-2.5 py-0.5 rounded-full bg-yellow-400/10 border border-yellow-400/20">${post.category}</span>
                  <span class="text-xs text-zinc-500">${post.date}</span>
                </div>
                <h3 class="text-lg sm:text-xl font-bold text-white group-hover:text-yellow-400 transition-colors line-clamp-2 mb-2">${post.title}</h3>
                <p class="text-xs sm:text-sm text-zinc-400 line-clamp-2 mb-4 leading-relaxed">${post.content.replace(/[#*`_>\[\]]/g, '').trim().slice(0, 150)}...</p>
              </div>
            </div>
            <div class="px-5 sm:px-6 pb-5 pt-0 flex items-center justify-between border-t border-zinc-800/50 mt-auto">
              <div class="flex flex-wrap gap-1.5 pt-3">${tagBadges}</div>
              <span class="text-xs text-yellow-400 font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform pt-3">읽기 <i class="fa-solid fa-arrow-right text-[10px]"></i></span>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold bg-yellow-400 text-zinc-950 shadow-sm transition-all';
        } else {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-zinc-900 text-zinc-300 hover:text-white border border-zinc-800 hover:border-zinc-700 transition-all';
        }
      });
      renderPosts();
    }

    function resetFilter() {
      currentCategory = 'ALL';
      currentQuery = '';
      document.getElementById('search-input').value = '';
      filterCategory('ALL');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleSearch() {
      currentQuery = document.getElementById('search-input').value;
      renderPosts();
    }

    function openPostModal(index) {
      const post = posts[index];
      if (!post) return;
      document.getElementById('modal-title').textContent = post.title;
      document.getElementById('modal-category').textContent = post.category;
      document.getElementById('modal-date').innerHTML = `<i class="fa-regular fa-clock mr-1"></i> ${post.date}`;
      document.getElementById('modal-lang').innerHTML = `<i class="fa-solid fa-globe mr-1"></i> ${post.lang.toUpperCase()}`;
      
      const imgContainer = document.getElementById('modal-image-container');
      const imgEl = document.getElementById('modal-image');
      if (post.image) {
        imgEl.src = post.image;
        imgContainer.classList.remove('hidden');
      } else {
        imgContainer.classList.add('hidden');
      }

      document.getElementById('modal-content').innerHTML = marked.parse(post.content);
      
      const tagsEl = document.getElementById('modal-tags');
      tagsEl.innerHTML = (post.tags || []).map(t => `<span class="text-xs bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded-md">#${t}</span>`).join('');
      
      document.getElementById('post-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
      if (!event || event.target.id === 'post-modal' || !event.target.closest('#post-modal > div')) {
        document.getElementById('post-modal').classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    function toggleTheme() {
      const html = document.getElementById('html-root');
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.className = 'fa-solid fa-sun text-base text-yellow-500';
      } else {
        html.classList.add('dark');
        icon.className = 'fa-solid fa-moon text-base text-zinc-400';
      }
    }

    window.addEventListener('DOMContentLoaded', loadPosts);
  </script>
</body>
</html>
