# .github/editorial/edit-spec.yml
# 이슈 처리 워크플로가 이 명세로 요청을 검증하고, AI에 넘길 정형 프롬프트를 만든다.
# 규칙: 요청한 edit_type의 allowed_paths 밖 파일은 절대 수정하지 않는다.

targets:
  page:   # 고정 페이지 (pages.json의 id로 선택)
    source: pages.json
  post:   # 게시글 (URL 또는 제목 입력 -> posts.json으로 매칭)
    source: posts.json

edit_types:
  image_change:
    label: 게시글 이미지 변경
    issue_label: "edit:image"
    target: post
    required: [target_post, user_prompt]
    allowed_paths: ["_posts/**", "assets/**", "posts.json"]
    forbidden: ["본문 텍스트", "레이아웃", "코드", "설정"]

  text_change:
    label: 문구 수정
    issue_label: "edit:page"
    target: page
    required: [target_page, after]
    allowed_paths: ["{page.path}"]

  seo_meta:
    label: SEO 메타 수정
    issue_label: "edit:page"
    target: page
    required: [target_page, after]
    allowed_paths: ["{page.path}"]
    only_fields: [title, description]   # front matter의 이 필드만 변경

  layout:
    label: 섹션/레이아웃 변경
    issue_label: "edit:page"
    target: page
    required: [target_page, after]
    allowed_paths: ["{page.path}", "_layouts/**", "_includes/**"]

  link_change:
    label: 링크 변경
    issue_label: "edit:page"
    target: page
    required: [target_page, before, after]
    allowed_paths: ["{page.path}"]

output:
  mode: pull_request          # main 직접 푸시 금지
  branch_prefix: "issue-edit/"
  comment_on_reject: true     # 필수 항목 누락/허용 경로 위반 시 이슈에 사유 코멘트
