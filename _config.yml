title: 챈스블로그
lang: ko
email: shine88pc@gmail.com
description: 기술, 경제, 사회, 과학, 문화와 일상의 변화를 연결해 맥락과 근거를 설명하는 교양형 매거진입니다.
baseurl: "/chanceblog"
url: "https://shine88pc.github.io"
timezone: Asia/Seoul
permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 깔끔한 반응형 공식 테마 적용
theme: minima

# 운영 문서는 저장소에만 두고 사이트(페이지·사이트맵·글 내비·정적 파일)로는 내보내지 않는다(2026-10-26 운영자 승인 "7. 진행", D-08·SIT-03).
# 승인 범위는 운영 문서(AGENTS·AI_COLLAB·CLAUDE·GEMINI·HANDLER·WORKLOG·docs/·인수인계/)다. 코드·상태 파일(generator.py·pipeline/·scripts/·tests/·history.json 등)을
# 정적 파일로 여는 것을 줄이는 일은 운영자 승인(2026-10-26 채팅 "2. 추천대로")을 받아 후속 PR에서 한다(인수인계/작업내용.md §3 18번). 사이트에 필요한 것(index.html·about·contact·privacy·categories·
# posts.json·feed.xml·robots.txt·assets·검색 인증 html)은 여기에 넣지 않는다. 새 운영 문서 폴더를 만들면 여기에도 더한다(tests/test_site_cleanup.py 가 목록을 지킨다).
# 주의: Jekyll 3.10 의 exclude 는 이름이 같은 파일·폴더뿐 아니라 이름이 항목으로 시작하는 것도 뺀다(예: 항목 docs 는 docs-x.html 도).
exclude:
  - AGENTS.md
  - AI_COLLAB.md
  - CLAUDE.md
  - GEMINI.md
  - HANDLER.md
  - WORKLOG.md
  - docs
  - 인수인계
