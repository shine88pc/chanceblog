name: "[공통] 병합 부탁 알림 자동 보내기"

# AI 가 올린 병합 가지(`ai/claude/M번호-이름`)의 PR 이 만들어지고 그 커밋의 검사가 모두 초록이면, 운영자 휴대폰(텔레그램)으로 '[M번호] 병합 부탁 — …' 알림을 자동으로 보낸다.
# 지금은 AI 가 같은 알림을 요청 파일로 직접 보낸다 — 이 워크플로는 그것을 대신할 준비이고 **병합돼도 꺼진 채**다(켬 상태 파일 `pipeline/auto_notice.json`, 아래 첫 항목).
# 운영자가 읽는 설명: 인수인계/운영자_요청함_사용법.md '8.', 규칙: docs/SECURITY_GUARDRAILS.md G-A13·G-A14, 구조: docs/ARCHITECTURE.md §4-6-4, 계산·문장: pipeline/auto_notice.py.
# **이 워크플로는 병합하지 않는다.** 병합·승인·라벨·코멘트·가지 삭제·설정 변경·다른 워크플로 실행도 하지 않는다(GitHub 는 읽기만 한다 — 쓰기 권한 0).
#
# 구조: job 둘 — 판정 job(`decide`: 읽기 권한만, 시크릿 없음, 값을 거르고 GitHub 를 읽어 문장을 만든다)과 발송 job(`send`: `needs: decide`, 시크릿은 여기에만, 문장을 다시 검사해 텔레그램으로 보낸다).
#   발송 job 은 판정 job 의 출력 `send` 가 yes 일 때(켬 상태 `on` 이고 문장이 만들어졌을 때)만 시작한다 — `off`·`dry` 에서는 발송 job 이 시작도 하지 않아 시크릿이 어떤 러너에도 내려가지 않는다(두 job 은 러너가 다르다).
#   문장은 판정 job 의 출력 `message` 로만 넘어간다 — base64 한 줄(영문·숫자·`+/=` 뿐이라 줄 바꿈·따옴표·`::` 명령 머리가 끼어들 수 없다). 발송 job 이 env 로 받아 파이썬이 풀어 다시 검사한다.
#   그 값은 발송 단계의 env 줄로 실행 로그에 보인다 — 문장 그대로는 아니고(base64), 이미 거른 글이며 어차피 같은 글이 텔레그램으로 간다.
#
# 규칙(docs/SECURITY_GUARDRAILS.md G-A13·G-A14, tests/test_merge_notice_workflows.py 와 검증기 WF-16 이 고정한다):
#  - 트리거는 `workflow_run` 하나다 — `[공통] 병합 부탁 PR 자동 만들기`(auto-pr.yml)가 끝난 뒤, 병합 가지(`ai/claude/M###-*`·`ai/claude/M####-*`)에서만. `workflow_run` 은 시크릿을 쥔 채 도는
#    위험한 트리거라 이 저장소에서는 이 파일과 `merge-confirm-notice.yml` 둘에만 허용한다(검증기 WF-16 이 허용 목록으로 막는다). `pull_request_target`·`issue_comment`·`schedule`·`workflow_dispatch` 는 쓰지 않는다.
#  - **가지(PR 머리)의 코드는 내려받지도 실행하지도 않는다.** 체크아웃은 기본 가지의 코드만(두 job 모두 `ref` 를 명시하고 `persist-credentials: false`), 실행하는 것은 기본 가지의 `pipeline/auto_notice.py` 뿐이다.
#  - 가지 이름·PR 제목·본문은 AI 가 쓴 글이다. `github.event.workflow_run.*` 값은 단계의 env 로만 넘기고 `run:` 에는 `${{ }}` 를 끼우지 않는다(검증기 WF-16 은 이 워크플로의 run 에 식을 하나도 허용하지 않는다).
#    파이썬이 모양을 거른다(가지·커밋 40자·제목 머리·200자·제어 문자·`@`·주소·비밀 모양). 걸리면 보내지 않고 요약에 고정 문장만 남긴다. 로그·요약에는 제목·본문 원문을 찍지 않는다.
#  - 권한은 contents·pull-requests·actions 읽기 셋뿐이다(쓰기 0, job 에 따로 달지 않는다). 시크릿은 텔레그램 둘뿐이고 **발송 job 의 마지막 단계 env 로만** 넘긴다 — 판정 job 에는 시크릿이 하나도 없다.
#    외부 액션은 이 저장소의 다른 워크플로가 쓰는 `actions/checkout`·`actions/setup-python` 뿐이다.
#  - 새 의존성이 없다(파이썬 표준 라이브러리). GitHub 읽기·텔레그램은 기존 클라이언트(운영자 요청함 접수 코드의 GitHub 클래스와 `notify.Notifier`)를 쓴다 — 새 외부 접속 코드는 없다.
#
# 알아 둘 것(한계):
#  - 켬 상태(`pipeline/auto_notice.json` 의 `mode`): `off`(기본 — 판정 job 이 곧바로 끝나고 발송 job 은 시작도 하지 않는다, GitHub 도 텔레그램도 부르지 않는다)·`dry`(모든 계산을 하고 보낼 문장을 실행 요약에만 남김, 텔레그램 0)·`on`(발송).
#    파일을 못 읽거나 값이 이상하면 `off`. `dry` → `on` 으로 바꾸는 것은 별도 병합 부탁(T3)이다. 이 워크플로가 GitHub 에서 처음 도는 것은 병합 뒤이고 `off` 라 곧바로 끝난다 — 첫 관측은 `dry` 로 한다.
#  - `workflow_run` 은 기본 가지에 있는 이 파일 그대로 돈다(가지가 이 파일을 바꿔도 소용없다). 코드는 기본 가지의 최신 커밋이다.
#  - 보내는 때: ① 병합 부탁 PR 자동 만들기 실행이 성공으로 끝났고 ② 이 가지의 열린 PR 이 하나이고 머리 커밋이 이 실행의 커밋과 같고 대상이 기본 가지이며 초안이 아니고 제목이 `[M번호] ` 로 시작하고
#    ③ 그 커밋의 push 검사 실행이 모두 끝나 성공(가드레일 포함)일 때뿐이다. 아니면 보내지 않고 성공으로 끝난다(빨강으로 만들지 않는다). 끝나지 않은 검사만 남았으면 20초 간격으로 세 번 더 본다.
#    PR 을 노란 배너로 직접 만들었거나 자동 PR 실행이 실패한 가지는 이 알림이 가지 않는다 — AI 의 요청 파일 알림이 병행한다.
#  - 중복: 같은 커밋의 실행은 한 줄로 세운다(concurrency 그룹을 커밋마다). 그래도 GitHub 화면에서 실행을 다시 돌리면(Re-run) 같은 알림이 한 번 더 간다. 같은 PR 에 새 커밋을 force-push 해 검사가 다시 초록이 되면
#    새 커밋 기준으로 한 번 더 간다. 쓰기 권한이 없어 '이미 보냈다' 표시를 남기지 못하므로 이 틈은 막지 못한다.
#  - GitHub 응답 하나가 2MB 를 넘으면 읽지 못해 보내지 않는다. 알림은 보조다 — 읽기·전송 실패는 경고 한 줄 뒤 성공으로 끝난다.
#  - 이 워크플로는 이 블로그 저장소 전용이다. 데스크톱 앱 저장소에는 텔레그램 시크릿이 없어 같은 알림을 만들지 않는다(설계만 같게 둔다).

on:
  workflow_run:
    workflows: ["[공통] 병합 부탁 PR 자동 만들기"]
    types: [completed]
    branches:
      - 'ai/claude/M[0-9][0-9][0-9]-*'
      - 'ai/claude/M[0-9][0-9][0-9][0-9]-*'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: merge-ready-notice-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  decide:
    name: 병합 부탁 알림 판정(시크릿 없음)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      send: ${{ steps.decide.outputs.send }}
      message: ${{ steps.decide.outputs.message }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 값은 한 줄도 `run:` 에 끼우지 않는다. 켬 상태가 off 면 파이썬이 한 줄 남기고 곧바로 끝난다(출력 없음 → 발송 job 은 시작하지 않는다). 시크릿은 이 job 에 없다.
      - name: 병합 부탁 문장 만들기(켬 상태가 꺼짐이면 곧바로 끝)
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_RUN_ID: ${{ github.event.workflow_run.id }}
          NOTICE_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          NOTICE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          NOTICE_RUN_EVENT: ${{ github.event.workflow_run.event }}
          NOTICE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NOTICE_RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          NOTICE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m pipeline.auto_notice merge-ready

  send:
    name: 병합 부탁 알림 발송(시크릿은 이 job 에만)
    needs: decide
    if: needs.decide.outputs.send == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 켬 상태가 on 이고 판정 job 이 문장을 만들었을 때만 이 job 이 시작한다. 파이썬이 켬 상태를 다시 읽고 받은 문장(base64)을 풀어 한 번 더 검사한 뒤 보낸다.
      - name: 텔레그램으로 보내기(켬 상태가 on 일 때만)
        env:
          NOTICE_MESSAGE_B64: ${{ needs.decide.outputs.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.auto_notice send
