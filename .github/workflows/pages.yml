name: 사이트 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 사이트 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v6

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: Jekyll 사이트 빌드
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Pages 산출물 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: 사이트 게시
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4

  # 배포 성공 != 공개 반영. 저장소의 가장 새 글(공개될 것: published: false·미래 날짜 제외)의 공개 주소가 HTTP 200으로
  # 열리는지 확인한다. 공개 CDN은 404도 보관하고(최대 약 18분, 1회 측정) 쿼리 문자열·no-cache 헤더로는 피하지 못하므로,
  # 안 열리면 시도마다 요청 모양(index.html·Accept-Encoding·//·./)을 바꿔 새 캐시 객체로 다시 확인한다. 대기는 10초에서
  # 2배씩 늘어(10·20·40·80·160초) 마감 12분까지 이어지고, 끝내 안 열리면 이 실행이 실패(빨강)가 되어 워치독이 알린다.
  # 잡 제한 15분 = 마감 12분 + 마지막 요청 + 준비 시간. docs/DEFECT_REGISTER.md D-41
  verify:
    name: 사이트 반영 확인
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 공개 사이트에 최신 글이 올라왔는지 확인
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 -u scripts/verify_pages_deploy.py --base "$PAGE_URL"
