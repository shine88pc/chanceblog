name: Blogger Generate (Draft Only)

on:
  schedule:
    # KST 11:00 ≈ UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 주제 (비우면 자동 선택)'
        required: false
        type: string
      dry_run:
        description: 'DRY_RUN (Gemini 호출 없이 스텁)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blogger-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Blogger 글 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true && '1' || '0' }}
        run: python blogger_generator.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogger_history.json _blogger_drafts || true
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "🤖 Blogger 초안 자동 생성"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
