name: "[내부] Blogger 글 작성 공용(직접 실행하지 마세요)"

# 이 파일은 직접 실행하는 워크플로가 아니라 채널별 래퍼가 부르는 공용 로직이다(on: workflow_call 뿐이라 Run workflow 버튼이 없다).
#   영문 Blogger(macat0722) = blogger-en.yml  ·  한글 Blogger(kcyoon) = blogger-ko.yml
# 래퍼가 자기 예약(cron)·수동 입력·concurrency 와 시크릿을 갖고, 이 파일에는 한 블로그의 key(`blog`)와 입력 값을 `with:` 로 명시해 넘긴다.
# 그래서 이 파일은 github.event_name·github.event.inputs 를 읽지 않는다(부르는 쪽 이벤트를 가정하지 않는다). 연습 실행 기본값·정기 실행 규칙은 래퍼의 식이 정한다.
# 시크릿은 `secrets: inherit` 가 아니라 래퍼가 역할 이름(PIPELINE_SECRET_<역할>)으로 명시해 넘긴 것만 쓴다 — 한글 Blogger 는 영문과 계정·OAuth 클라이언트가 달라야 하므로
# 래퍼마다 자기 블로그의 시크릿 이름만 넘기고(scripts/validate_repo.py REG-6 이 레지스트리와 같은지 확인), 텔레그램 시크릿 둘은 단계 env 로만 쓴다(WF-13).
# 새 Blogger 블로그를 더하면 레지스트리 항목과 이 파일을 부르는 래퍼 하나를 추가한다(이 파일은 고치지 않는다).

on:
  workflow_call:
    inputs:
      blog:
        description: '실행할 블로그 key (pipeline/blogs.json 의 key, 래퍼가 정한다)'
        required: true
        type: string
      topic:
        description: '직접 정할 주제 (비우면 자동 선택)'
        required: false
        type: string
        default: ''
      dry_run:
        description: '연습 실행: 가짜 AI 응답을 쓰고 Gemini를 호출하지 않으며 파일 저장·게시·하루 상한 소진 없이 로그만 남긴다. 래퍼가 정기 실행에서는 끄고 수동 실행에서는 체크 값을 넘긴다'
        required: false
        type: boolean
        default: true
      publish:
        description: '글을 어디까지: off=저장소 파일만 / draft=Blogger 초안함 / publish=즉시 게시. 비우면(정기 실행) 레지스트리 mode 를 따른다'
        required: false
        type: string
        default: ''
      auth_check:
        description: '인증 점검만 실행: 글·Gemini 없이 토큰·블로그·주소만 확인(쓰기 없음)'
        required: false
        type: boolean
        default: false
    secrets:
      PIPELINE_SECRET_LLM_API_KEY:
        description: 'Gemini 키(레지스트리 secrets.llm_api_key 의 값, 래퍼가 넘긴다)'
        required: false
      PIPELINE_SECRET_BLOG_ID:
        description: 'Blogger 블로그 ID(레지스트리 secrets.blog_id)'
        required: false
      PIPELINE_SECRET_CLIENT_ID:
        description: 'OAuth 클라이언트 ID(레지스트리 secrets.client_id)'
        required: false
      PIPELINE_SECRET_CLIENT_SECRET:
        description: 'OAuth 클라이언트 시크릿(레지스트리 secrets.client_secret)'
        required: false
      PIPELINE_SECRET_REFRESH_TOKEN:
        description: 'OAuth refresh token(레지스트리 secrets.refresh_token)'
        required: false
      TELEGRAM_BOT_TOKEN:
        description: '휴대폰 알림용(선택). 없으면 알림 없이 그대로 동작한다'
        required: false
      TELEGRAM_CHAT_ID:
        description: '휴대폰 알림용(선택). 없으면 알림 없이 그대로 동작한다'
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: 대상 블로그 계획
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 실행 대상 계산 (레지스트리 검증 포함)
        id: plan
        env:
          ONLY_BLOG: ${{ inputs.blog }}
          AUTH_CHECK_ONLY: ${{ inputs.auth_check && '1' || '' }}
        run: |
          set -euo pipefail
          args=(--platform blogger)
          if [ -n "${ONLY_BLOG:-}" ]; then args+=(--only "$ONLY_BLOG"); fi
          # 인증 점검만 하는 수동 실행은 정지(mode off)한 블로그도 대상에 넣는다(쓰기가 없고, 시크릿을 등록한 직후 mode 를 켜기 전에 확인해야 한다)
          if [ -n "${AUTH_CHECK_ONLY:-}" ]; then args+=(--include-off); fi
          # echo "matrix=$(명령)" 처럼 명령 치환을 echo 안에 넣으면 plan 이 실패해도 echo 가 성공해 이 단계가
          # 초록으로 지나가고 matrix 가 빈 값이 된다. 그래서 먼저 변수에 받아 set -e 가 실패를 잡게 한다.
          matrix=$(python -m pipeline.plan "${args[@]}")
          count=$(python -m pipeline.plan "${args[@]}" --count)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          # 위 plan 은 --only 가 레지스트리에 없거나 blogger 가 아닌 key 면 실패한다(이 단계가 빨강). 그래서 여기 오는
          # 대상 0개는 대상(수동 실행이면 지정한 블로그, 아니면 platform=blogger 전체)이 모두 mode=off 이거나 없을 때뿐이다.
          if [ "$count" = "0" ]; then
            echo "::notice::실행할 Blogger 블로그가 없습니다(대상이 모두 mode=off 로 정지됐거나 platform=blogger 블로그가 없음). generate 잡은 건너뜁니다."
            {
              echo "### Blogger 글 자동 작성"
              echo "- 결과: **대상 0개** — pipeline/blogs.json 에서 대상(수동 실행이면 지정한 블로그, 아니면 platform=blogger 블로그 전체)이 모두 mode=off(정지)이거나 없습니다. 글은 만들지 않았습니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  generate:
    name: 글 생성 (${{ matrix.key }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: blogger-${{ matrix.key }}
      cancel-in-progress: false
    env:
      # 킬 스위치: 저장소 Settings > Variables 에 PIPELINE_PAUSE=true 를 넣으면 전부 멈춘다
      PIPELINE_PAUSE: ${{ vars.PIPELINE_PAUSE }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt

      - name: 생성 → 검증 → 게시/초안
        env:
          BLOG_KEY: ${{ matrix.key }}
          BLOGGER_TOPIC: ${{ inputs.topic }}
          # 정기 실행: 비움(레지스트리 mode 를 따름) / 수동: 고른 값 그대로(off=저장소 파일만, draft=Blogger 초안함 업로드, publish=즉시 게시). 정기·수동 구분은 래퍼가 한다
          BLOGGER_PUBLISH: ${{ inputs.publish }}
          # 수동 실행의 '인증 점검만 실행'(체크하면 1). 정기 실행은 항상 비어 글을 만든다(래퍼가 정기 실행에서는 false 를 넘긴다)
          BLOGGER_AUTH_CHECK: ${{ inputs.auth_check && '1' || '' }}
          # 래퍼가 블로그마다 다른 Secrets 를 역할 이름으로 넘긴 것을 그대로 러너에 준다(값은 로그에 마스킹됨)
          PIPELINE_SECRET_LLM_API_KEY: ${{ secrets.PIPELINE_SECRET_LLM_API_KEY }}
          PIPELINE_SECRET_BLOG_ID: ${{ secrets.PIPELINE_SECRET_BLOG_ID }}
          PIPELINE_SECRET_CLIENT_ID: ${{ secrets.PIPELINE_SECRET_CLIENT_ID }}
          PIPELINE_SECRET_CLIENT_SECRET: ${{ secrets.PIPELINE_SECRET_CLIENT_SECRET }}
          PIPELINE_SECRET_REFRESH_TOKEN: ${{ secrets.PIPELINE_SECRET_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.run --blog "$BLOG_KEY"

      # 생성 단계가 실패해도(llm_failed/publish_failed) 기록과 초안은 남긴다
      - name: 변경 사항 커밋
        if: ${{ !cancelled() }}
        env:
          BLOG_KEY: ${{ matrix.key }}
          HISTORY_FILE: ${{ matrix.history }}
          CONTENT_DIR: ${{ matrix.content_dir }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then echo "DRY_RUN — 커밋 생략"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in "$HISTORY_FILE" "$CONTENT_DIR"; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then echo "커밋할 변경 없음"; exit 0; fi
          git commit -m "🤖 [${BLOG_KEY}] 생성/게시 기록"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "push 실패" >&2
          exit 1
