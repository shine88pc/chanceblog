name: Blogger 글 자동 작성
run-name: "Blogger 글 작성 · ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '수동(연습: 저장·게시 안 함)' || (inputs.publish == 'publish' && '수동(즉시 게시)' || (inputs.publish == 'off' && '수동(저장소 파일만 저장)' || '수동(Blogger 초안함 업로드)'))) || '정기' }}"

# 레지스트리(pipeline/blogs.json)의 platform=blogger 블로그를 모두 처리한다.
# 블로그를 추가하면 이 파일을 고치지 않고 레지스트리와 Secrets 만 추가하면 된다.
# schedule.cron 은 레지스트리 값과 같아야 한다(scripts/validate_repo.py 가 확인).

on:
  schedule:
    # KST 11:00 = UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      blog:
        description: '실행할 블로그 key (비우면 Blogger 블로그 전체)'
        required: false
        type: string
      topic:
        description: '직접 정할 주제 (비우면 자동 선택)'
        required: false
        type: string
      dry_run:
        description: '연습 실행(가짜 AI 응답 사용, 파일·게시 없이 로그만). 기본은 꺼짐 — 체크하지 않으면 초안이 저장소에 커밋되고 그날 하루 상한을 씁니다'
        type: boolean
        default: false
      publish:
        description: '글을 어디까지 보낼지 고릅니다(정기 실행은 이 선택을 쓰지 않고 레지스트리 mode를 따름). off = 저장소 파일에만 저장하고 Blogger는 건드리지 않음 / draft(기본) = Blogger 초안함에 업로드하며 공개되지 않고, 운영자가 Blogger 화면에서 확인한 뒤 직접 게시(게시용 시크릿 4종이 모두 있어야 올라가고, 하나도 없으면 저장소 파일에만 저장, 일부만 있으면 빨강) / publish = Blogger에 즉시 게시(게시용 시크릿이 없으면 빨강). 연습 실행을 체크하면 어느 쪽이든 아무것도 저장·업로드·게시하지 않음'
        type: choice
        default: 'draft'
        options:
          # 따옴표가 필요하다: 따옴표 없는 off 는 YAML 1.1 파서(PyYAML 등)가 문자열이 아니라 false 로 읽는다
          - 'off'
          - 'draft'
          - 'publish'

permissions:
  contents: read

jobs:
  plan:
    name: 대상 블로그 계획
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 실행 대상 계산 (레지스트리 검증 포함)
        id: plan
        env:
          ONLY_BLOG: ${{ github.event.inputs.blog }}
        run: |
          set -euo pipefail
          args=(--platform blogger)
          if [ -n "${ONLY_BLOG:-}" ]; then args+=(--only "$ONLY_BLOG"); fi
          # echo "matrix=$(명령)" 처럼 명령 치환을 echo 안에 넣으면 plan 이 실패해도 echo 가 성공해 이 단계가
          # 초록으로 지나가고 matrix 가 빈 값이 된다. 그래서 먼저 변수에 받아 set -e 가 실패를 잡게 한다.
          matrix=$(python -m pipeline.plan "${args[@]}")
          count=$(python -m pipeline.plan "${args[@]}" --count)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          # 위 plan 은 --only 가 레지스트리에 없거나 blogger 가 아닌 key 면 실패한다(이 단계가 빨강). 그래서 여기 오는
          # 대상 0개는 대상(수동 실행이면 지정한 블로그, 아니면 platform=blogger 전체)이 모두 mode=off 이거나 없을 때뿐이다.
          if [ "$count" = "0" ]; then
            echo "::notice::실행할 Blogger 블로그가 없습니다(대상이 모두 mode=off 로 정지됐거나 platform=blogger 블로그가 없음). generate 잡은 건너뜁니다."
            {
              echo "### Blogger 글 자동 작성"
              echo "- 결과: **대상 0개** — pipeline/blogs.json 에서 대상(수동 실행이면 지정한 블로그, 아니면 platform=blogger 블로그 전체)이 모두 mode=off(정지)이거나 없습니다. 글은 만들지 않았습니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  generate:
    name: 글 생성 (${{ matrix.key }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: blogger-${{ matrix.key }}
      cancel-in-progress: false
    env:
      # 킬 스위치: 저장소 Settings > Variables 에 PIPELINE_PAUSE=true 를 넣으면 전부 멈춘다
      PIPELINE_PAUSE: ${{ vars.PIPELINE_PAUSE }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt

      - name: 생성 → 검증 → 게시/초안
        env:
          BLOG_KEY: ${{ matrix.key }}
          BLOGGER_TOPIC: ${{ github.event.inputs.topic }}
          # 스케줄: 비움(레지스트리 mode 를 따름) / 수동: 고른 값 그대로(off=저장소 파일만, draft=Blogger 초안함 업로드, publish=즉시 게시)
          BLOGGER_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || '' }}
          # 블로그마다 다른 Secrets 이름을 역할 이름으로 넘긴다(값은 로그에 마스킹됨)
          PIPELINE_SECRET_LLM_API_KEY: ${{ secrets[matrix.secret_llm_api_key] }}
          PIPELINE_SECRET_BLOG_ID: ${{ secrets[matrix.secret_blog_id] }}
          PIPELINE_SECRET_CLIENT_ID: ${{ secrets[matrix.secret_client_id] }}
          PIPELINE_SECRET_CLIENT_SECRET: ${{ secrets[matrix.secret_client_secret] }}
          PIPELINE_SECRET_REFRESH_TOKEN: ${{ secrets[matrix.secret_refresh_token] }}
        run: python -m pipeline.run --blog "$BLOG_KEY"

      # 생성 단계가 실패해도(llm_failed/publish_failed) 기록과 초안은 남긴다
      - name: 변경 사항 커밋
        if: ${{ !cancelled() }}
        env:
          BLOG_KEY: ${{ matrix.key }}
          HISTORY_FILE: ${{ matrix.history }}
          CONTENT_DIR: ${{ matrix.content_dir }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then echo "DRY_RUN — 커밋 생략"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in "$HISTORY_FILE" "$CONTENT_DIR"; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then echo "커밋할 변경 없음"; exit 0; fi
          git commit -m "🤖 [${BLOG_KEY}] 생성/게시 기록"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "push 실패" >&2
          exit 1
