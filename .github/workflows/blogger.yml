name: Blogger Generate

on:
  schedule:
    # KST 11:00 ≈ UTC 02:00 — 기본은 생성만 (게시 Secrets 있을 때만 자동 게시)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 주제 (비우면 자동 선택)'
        required: false
        type: string
      dry_run:
        description: 'DRY_RUN (Gemini 스텁)'
        type: boolean
        default: false
      publish:
        description: 'Blogger API로 게시 (Secrets 필요)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blogger-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-auth google-auth-oauthlib google-api-python-client

      - name: Blogger 글 생성 (및 선택적 게시)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true && '1' || '0' }}
          # 스케줄 실행: Secrets가 있으면 게시, 수동은 publish 입력 따름
          BLOGGER_PUBLISH: ${{ github.event_name == 'schedule' && '1' || (github.event.inputs.publish == true && '1' || '0') }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python blogger_generator.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogger_history.json _blogger_drafts || true
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "🤖 Blogger 생성/게시 로그"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
