name: Chance_Blog Full-Auto Engine

on:
  schedule:
    # 한국 시간 기준: 08:00, 13:00, 18:00, 22:00 (UTC 기준: 23시, 4시, 9시, 13시)
    - cron: '0 23,4,9,13 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 깃허브 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: AI 블로그 제너레이터 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python generator.py

      - name: 변경된 포스트 및 기록 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 08, 13, 18, 22시 자동 포스팅 및 자연어 제어 반영" || echo "No changes to commit"
          git push