name: "[Chance] 글 자동 작성·게시"
run-name: "[Chance] 글 작성·게시 · ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && (inputs.real_ai && '수동(연습: 실제 AI 호출·저장 안 함)' || '수동(연습: 저장 안 함)') || '수동') || '정기' }}"

on:
  schedule:
    # 매시 17분과 47분(UTC) 두 번 지정한다(2026-10-26 운영자 승인, D-59). GitHub 스케줄은 지연·누락이 잦아(틱이 하나였을 때 실측
    # 하루 5회 안팎, 3~6시간 간격) 한 틱이 빠져도 다른 틱이 받쳐 주길 바란 것이다. 게시는 하루 2편 슬롯 규칙이 지키므로 편수는 그대로다.
    # 게시 시각(KST 9/18시)은 generator.py의 SLOT_HOURS로 판단하며, 실행이 늦거나 빠져도
    # 다음 실행이 그 시각 글을 보충한다.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  # 이슈 기반 수정 요청은 issue-edit.yml 이 처리한다(D-01: 옛 LLM 파일 편집 핸들러는 제거함)
  # 기존 글의 이미지만 교체하는 수동 실행은 chance-fix-images.yml 로 분리했다(실행 기록·이름이 섞이지 않게)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 실행(파일·커밋·게시 없이 로그만, 가짜 AI 응답 사용) — 체크를 풀면 실제 Gemini로 글을 만들어 게시합니다(수동 게시는 게시 시각·하루 상한을 따지지 않습니다)'
        type: boolean
        default: true
      real_ai:
        description: '연습 실행에서도 실제 Gemini를 호출(무료 한도를 씁니다). 기본은 꺼짐 — 꺼 두면 가짜 AI 응답으로만 연습해 Gemini 한도를 쓰지 않습니다. 연습 실행을 푼 실제 게시에는 영향이 없습니다(항상 실제 호출). 연습도 Unsplash 이미지 검색은 실제로 합니다 — 시간당 한도를 정기 글과 나눠 씁니다'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # 새 커밋이 생기면 Pages 배포 워크플로를 dispatch 하기 위해 필요
  pull-requests: write  # 승인 흐름(레지스트리 publish_flow: pr)에서 초안 PR 을 열고 라벨을 붙이기 위해 필요(direct 에서는 쓰지 않는다)

concurrency:
  group: chanceblog
  cancel-in-progress: false

jobs:
  build:
    name: 글 작성·게시
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 발행 흐름은 레지스트리(pipeline/blogs.json)의 chance.publish_flow 가 정한다. direct(기본)는 지금처럼 글을 main 에 바로 커밋해 게시하고,
      # pr 은 초안 브랜치와 승인 PR 로 올린다(병합 = 공개). 값을 읽지 못하면 이 단계가 실패해 글을 만들기 전에 멈춘다 —
      # 승인 흐름이 켜진 채 레지스트리 오류 때문에 직접 게시로 떨어지지 않게 한다. direct 에서는 출력이 없다.
      - name: 발행 흐름 확인 (레지스트리 publish_flow)
        id: flow
        run: |
          set -euo pipefail
          flow=$(python -m pipeline.draft_flow flow)
          echo "flow=${flow}" >> "$GITHUB_OUTPUT"
          if [ "${flow}" = "pr" ]; then
            {
              echo "### 발행 흐름"
              echo "- 승인 흐름(pr): 글은 초안 브랜치와 PR 로 올라가고, 병합하면 공개됩니다(닫으면 폐기)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install "google-genai>=2,<3"

      - name: AI 블로그 제너레이터 실행
        env:
          # 수동 연습 실행의 기본은 가짜 AI 응답(스텁)이다: real_ai 를 체크하지 않으면 Gemini 키를 넘기지 않아 한도를 쓰지 않는다
          # (generator.py 는 키가 없으면 연습 실행을 스텁으로 돌린다). 정기 실행과 글을 실제로 게시하는 수동 실행은 항상 키를 넘긴다.
          GEMINI_API_KEY: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run || inputs.real_ai) && secrets.GEMINI_API_KEY || '' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          # 킬 스위치: 저장소 Settings > Variables 에 PIPELINE_PAUSE=true 를 넣으면 글 생성을 멈춘다(blogger.yml 과 같은 변수)
          PIPELINE_PAUSE: ${{ vars.PIPELINE_PAUSE }}
        run: python generator.py

      # 승인 흐름(pr)에서는 main 에 직접 커밋·배포 요청을 하지 않는다(글은 아래 '초안 올리기' 단계가 PR 로 올린다).
      - name: 변경 사항 커밋
        id: commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.flow.outputs.flow != 'pr' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
            echo "- 커밋: 없음(변경된 파일이 없습니다)" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "🤖 자동 포스팅/이미지 수정"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "- 커밋: $(git rev-parse --short HEAD) — ${GITHUB_REF_NAME} 브랜치에 push함" >> "$GITHUB_STEP_SUMMARY"
          fi

      # GITHUB_TOKEN 으로 push 한 커밋은 push 이벤트를 만들지 않아 pages.yml 이 자동 실행되지 않는다.
      # (workflow_dispatch 는 예외라서 직접 실행시킨다. docs/DEFECT_REGISTER.md D-02)
      - name: Pages 배포 실행 (새 커밋이 있을 때만)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 오래된 gh 는 터미널이 아니면 실행 주소를 출력하지 않는다 → 비어 있어도 요약이 끊기지 않게 한다.
          deploy=$(gh workflow run pages.yml --ref "${GITHUB_REF_NAME}")
          echo "$deploy"
          echo "- Pages 배포 실행 요청: ${deploy:-요청함}" >> "$GITHUB_STEP_SUMMARY"

      # 승인 흐름(pr): 만든 글 두 개를 초안 브랜치(ai/draft/…)로 올리고 승인 PR 을 연 뒤, 남은 초안(PR 없는 브랜치·오래된 브랜치)을 정리한다.
      # 이력 항목만 main 에 커밋하고(슬롯·제목 중복 검사용), 글은 PR 을 병합할 때 main 에 들어간다. 병합은 사람의 push 라서 사이트 배포(pages.yml)가
      # 저절로 실행되므로 여기서 배포를 요청하지 않는다. PR 을 열지 못하면(저장소 설정이 꺼져 있는 경우 등) 브랜치는 남고 이 단계가 빨강으로 끝난다.
      # 연습 실행은 아무것도 쓰지 않는다. 설명: docs/ARCHITECTURE.md §4-4
      - name: 초안 올리기와 승인 PR 열기 (승인 흐름일 때만)
        if: ${{ steps.flow.outputs.flow == 'pr' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          PIPELINE_PAUSE: ${{ vars.PIPELINE_PAUSE }}
        run: python -m pipeline.draft_flow deliver

      # 새 글을 push 했을 때만 휴대폰(텔레그램)으로 알린다. 시크릿 TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID 가 없으면 아무것도 보내지 않고 한 줄만 남긴다.
      # 알림이 실패해도 글 게시 실행은 실패시키지 않는다(실패는 ::warning:: 로 드러난다). 연습 실행은 push 가 없어 이 단계가 돌지 않는다.
      # 시크릿은 이 단계의 env 로만 넘긴다(검증기 WF-13). 설명: .github/editorial/TELEGRAM_SETUP.md
      - name: 텔레그램 알림(새 글)
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.notify chance-published --commit HEAD
