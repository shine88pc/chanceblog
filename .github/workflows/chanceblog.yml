name: Full-Auto Ultimate Blog Master

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자동 실행 (최근 24시간 핫토픽 자동 포스팅)
  workflow_dispatch:
  issues:
    types: [opened, edited] # 모바일 이슈 등록/수정 시 자연어 제어 실행

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Ultimate Master Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python generator.py

      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 핫토픽 자동 분석 및 자연어 통합 제어 실행" || echo "No changes to commit"
          git push