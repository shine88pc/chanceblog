name: Auto Blog Generator & Issue Handler

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자동 실행
  workflow_dispatch:
  issues:
    types: [opened] # 모바일에서 이슈를 등록(open)하면 즉시 실행!

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python generator.py

      - name: Commit and push generated blog post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ history.json
          git commit -m "🤖 모바일 이슈 기반 자동 포스팅 생성" || echo "No changes to commit"
          git push