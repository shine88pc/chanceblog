name: Auto Blog Generator

on:
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 기준 0시 (한국 시간 오전 9시)에 실행
  workflow_dispatch: # 수동으로도 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브 레포지토리에 커밋/푸시 권한 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generator.py

      - name: Commit and push generated blog post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ history.json
          git commit -m "🤖 자동 블로그 포스팅 생성" || echo "No changes to commit"
          git push