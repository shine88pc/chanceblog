name: Chance_Blog Full-Auto Engine

on:
  schedule:
    # 매시 17분(UTC). 게시 시각(KST 8/13/18/22시)은 generator.py의 SLOT_HOURS로 판단하며,
    # 실행이 지연/누락돼도 다음 시간 실행이 해당 시각 글을 보충한다.
    - cron: '17 * * * *'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      fix_images:
        description: '기존 글의 이미지만 교체 (새 글 생성 안 함)'
        type: boolean
        default: false
      dry_run:
        description: 'DRY_RUN (파일 변경/커밋 없이 로그만)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: chanceblog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 이슈는 제목이 [Control]로 시작하고, 저장소 소유자/멤버/협업자가 연 것만 처리
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, '[Control]') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: AI 블로그 제너레이터 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FIX_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.fix_images && '1' || '0' }}
        run: python generator.py

      - name: 변경 사항 커밋
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "🤖 자동 포스팅/이미지 수정"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
