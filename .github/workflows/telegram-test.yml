name: "[공통] 텔레그램 알림 시험"

# 텔레그램 알림이 휴대폰에 닿는지 확인하는 수동 시험이다(새 글·발행 대기·확인 필요 알림의 연결 확인). 눌러서 하는 일은 다음과 같다.
#   1. 시크릿 두 개(TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID)가 등록돼 있는지 이름별로 '등록됨/없음'만 실행 요약에 쓴다(값·길이·앞글자는 쓰지 않는다).
#   2. 둘 다 있을 때만 휴대폰에 '알림 연결 확인' 메시지 한 통을 보내고, 실패하면 이유(토큰 틀림·채팅 ID 틀림·봇에 /start 안 함·네트워크)를 요약에 쓴다.
# 시크릿 값은 단계의 env 로만 넘기고 명령 줄·로그·요약에 쓰지 않는다(검증기 WF-13, docs/SECURITY_GUARDRAILS.md G-C12). 설명서: .github/editorial/TELEGRAM_SETUP.md
# 이 워크플로는 저장소를 읽기만 하고 아무것도 쓰지 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-test
  cancel-in-progress: false

jobs:
  test:
    name: 알림 연결 시험
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 시크릿 등록 여부 확인
        id: status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.notify status

      - name: 시험 메시지 보내기
        if: steps.status.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.notify test
