name: "[Chance] 기존 글 이미지 교체(수동)"
run-name: "[Chance] 기존 글 이미지 교체 · ${{ inputs.dry_run && (inputs.real_ai && '연습(실제 AI 호출·저장 안 함)' || '연습(저장 안 함)') || '실제 교체' }}"

# 기존 글의 깨진·누락·중복 이미지만 교체한다(새 글은 만들지 않는다). 수동 실행 전용이다.
# 예전에는 chanceblog.yml 의 fix_images 입력이었다. 새 글을 쓰는 정기 실행과 이름·실행 기록이 섞이지 않게 분리했다.
# 권한·동시성·환경변수·커밋·Pages 배포 요청은 chanceblog.yml 과 같은 내용이다(다른 점은 트리거·입력·FIX_IMAGES 뿐).
# 한쪽의 커밋·배포 단계를 고치면 다른 쪽도 같이 고친다(tests/test_workflow_names.py 가 두 파일이 같은지 확인한다).
# concurrency 그룹이 chanceblog.yml 과 같아서 글 작성 실행과 동시에 돌며 커밋이 겹치는 일이 없다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 실행(파일·커밋 없이 교체 대상만 로그로 확인, 가짜 AI 검색어 사용) — 체크를 풀면 실제로 이미지를 교체하고 커밋합니다(한 번에 최대 20건, 나머지는 다음 실행)'
        type: boolean
        default: true
      real_ai:
        description: '연습 실행에서도 실제 Gemini를 호출(글마다 한 번씩 무료 한도를 씁니다). 기본은 꺼짐 — 꺼 두면 가짜 AI 검색어로만 연습해 Gemini 한도를 쓰지 않습니다. 연습 실행을 푼 실제 교체에는 영향이 없습니다(항상 실제 호출). 연습도 Unsplash 이미지 검색은 실제로 합니다 — 시간당 한도를 정기 글과 나눠 씁니다'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # 새 커밋이 생기면 Pages 배포 워크플로를 dispatch 하기 위해 필요

concurrency:
  group: chanceblog
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 교체·커밋
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install "google-genai>=2,<3"

      - name: 기존 글 이미지 교체 실행
        env:
          # 수동 연습 실행의 기본은 가짜 AI 응답(스텁)이다: real_ai 를 체크하지 않으면 Gemini 키를 넘기지 않아 한도를 쓰지 않는다
          # (chanceblog.yml 과 같은 식 — tests/test_workflow_names.py 가 두 파일의 단계가 같은지 확인한다).
          GEMINI_API_KEY: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run || inputs.real_ai) && secrets.GEMINI_API_KEY || '' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          # 새 글 없이 기존 글의 이미지만 교체하는 모드(generator.py 의 FIX_IMAGES)
          FIX_IMAGES: '1'
          # 킬 스위치: 저장소 Settings > Variables 에 PIPELINE_PAUSE=true 를 넣으면 실행을 멈춘다(chanceblog.yml·blogger.yml 과 같은 변수)
          PIPELINE_PAUSE: ${{ vars.PIPELINE_PAUSE }}
        run: python generator.py

      - name: 변경 사항 커밋
        id: commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
            echo "- 커밋: 없음(변경된 파일이 없습니다)" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "🤖 자동 포스팅/이미지 수정"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "- 커밋: $(git rev-parse --short HEAD) — ${GITHUB_REF_NAME} 브랜치에 push함" >> "$GITHUB_STEP_SUMMARY"
          fi

      # GITHUB_TOKEN 으로 push 한 커밋은 push 이벤트를 만들지 않아 pages.yml 이 자동 실행되지 않는다.
      # (workflow_dispatch 는 예외라서 직접 실행시킨다. docs/DEFECT_REGISTER.md D-02)
      - name: Pages 배포 실행 (새 커밋이 있을 때만)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 오래된 gh 는 터미널이 아니면 실행 주소를 출력하지 않는다 → 비어 있어도 요약이 끊기지 않게 한다.
          deploy=$(gh workflow run pages.yml --ref "${GITHUB_REF_NAME}")
          echo "$deploy"
          echo "- Pages 배포 실행 요청: ${deploy:-요청함}" >> "$GITHUB_STEP_SUMMARY"
