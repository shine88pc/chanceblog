name: Issue Edit

# 이슈 양식('고정 페이지 수정' · '기존 게시글 이미지 변경')으로 접수된 수정 요청을 처리해 **PR 로** 올린다.
# main 에 직접 push 하지 않는다. 결과는 사람이 검토·병합한다. 설명: docs/ISSUE_EDITS.md
# 수정 범위·검증은 .github/editorial/edit-spec.yml 과 pipeline/edits/ 가 정한다.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '처리할 이슈 번호'
        required: true
        type: string
      dry_run:
        description: 'DRY_RUN (파일·PR·코멘트 없이 로그만)'
        type: boolean
        default: true

permissions:
  contents: read

# 이슈마다 따로 줄을 세운다(공용 그룹이면 대기 중인 이슈가 코멘트 없이 취소된다)
concurrency:
  group: issue-edit-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  edit:
    # 소유자·멤버·협업자가 연 제어 이슈만 처리한다(수동 실행은 항상 허용). 작성자 권한은 처리 코드에서 한 번 더 확인한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
       (contains(github.event.issue.labels.*.name, 'blog-control') ||
        startsWith(github.event.issue.title, '[페이지 수정]') ||
        startsWith(github.event.issue.title, '[이미지 변경]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # 번호는 신뢰할 수 없는 입력이다(수동 실행의 문자열). 다른 단계가 쓰기 전에 형식부터 확인한다 — 앞자리 0 도 거부한다(브랜치 패턴 우회 방지).
      # 이 정규식은 pipeline/edits/runner.py 의 ISSUE_NUMBER_PATTERN 과 같아야 한다(테스트가 대조).
      - name: 이슈 번호 형식 검사
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "이슈 번호는 1~999999999 의 숫자여야 합니다(앞자리 0 불가)." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-edits.txt

      # 이슈 양식의 라벨은 저장소에 이미 있어야 적용된다. 없으면 만든다(있으면 갱신).
      - name: 처리 경로 라벨 보장
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          gh label create "blog-control" --color 0e8a16 --description "블로그 수정 요청" --force
          gh label create "edit:page" --color 1d76db --description "고정 페이지 수정 요청" --force
          gh label create "edit:image" --color 5319e7 --description "게시글 이미지 변경 요청" --force
          gh label create "issue-edit-done" --color ededed --description "issue-edit 가 처리를 끝낸 이슈(같은 이슈를 다시 처리하지 않는 표식)" --force

      # 이슈 본문은 신뢰할 수 없는 입력이다: 셸에 보간하지 않고 API 로 파일에 받아 코드가 읽는다.
      - name: 이슈 내용 가져오기
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "${RUNNER_TEMP}/issue.json"

      # 한 이슈는 한 번만 처리한다: 이 이슈 번호로 만든 브랜치만 찾는다(앞부분을 고정한 전체 ref 패턴이라 1·12·120 이 섞이지 않는다).
      # 일치하는 것이 없어도 종료 코드는 0 이고, 러너가 이 목록과 이슈의 표식 라벨(issue-edit-done)로 이미 처리했는지 판단한다.
      - name: 이 이슈의 기존 브랜치 조회
        run: git ls-remote --heads origin "refs/heads/issue-edit/${ISSUE_NUMBER}-*" > "${RUNNER_TEMP}/remote_refs.txt"

      - name: 요청 해석·검증·수정
        id: edit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python -m pipeline.edits.runner --issue-file "${RUNNER_TEMP}/issue.json" --out "${RUNNER_TEMP}/issue-edit" --remote-refs "${RUNNER_TEMP}/remote_refs.txt"

      - name: 브랜치·커밋·PR 생성
        if: steps.edit.outcome == 'success' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/issue-edit"
          if [ "$(cat "$out/status.txt")" != "ok" ]; then echo "수정안 없음 — PR 을 만들지 않습니다"; exit 0; fi
          branch="$(cat "$out/branch.txt")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          while IFS= read -r f; do git add -- "$f"; done < "$out/files.txt"
          python -m pipeline.edits.runner --verify-staged "$out/files.txt"
          git commit -F "$out/commit_msg.txt"
          git push origin "$branch"
          if gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "$(cat "$out/pr_title.txt")" --body-file "$out/pr_body.md" > "$out/pr_url.txt"; then
            echo "PR: $(cat "$out/pr_url.txt")"
          else
            echo "PR 자동 생성 실패 — 저장소 설정 'Allow GitHub Actions to create and approve pull requests' 를 확인하세요." >&2
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${branch}?expand=1" > "$out/compare_url.txt"
          fi
          gh workflow run guardrails.yml --ref "$branch"

      - name: 이슈에 결과 코멘트
        if: always() && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/issue-edit"
          status="$(cat "$out/status.txt" 2>/dev/null || echo missing)"
          final="$out/final_comment.md"
          case "$status" in
            ok)
              if [ -s "$out/pr_url.txt" ]; then
                { echo "✅ **수정안을 PR 로 만들었습니다.** 검토 후 병합하면 반영됩니다."; echo; echo "- PR: $(cat "$out/pr_url.txt")"; cat "$out/summary.md"; } > "$final"
              elif [ -s "$out/compare_url.txt" ]; then
                { echo "✅ **수정 브랜치를 만들었습니다.** PR 자동 생성 권한이 없어 아래 링크에서 'Create pull request' 를 눌러 주세요."; echo; echo "- $(cat "$out/compare_url.txt")"; cat "$out/summary.md"; } > "$final"
              else
                echo "❌ 수정안은 만들었지만 브랜치·PR 단계에서 실패했습니다. Actions 로그를 확인하세요." > "$final"
              fi ;;
            rejected|error|duplicate) cp "$out/comment.md" "$final" ;;
            ignored) echo "처리 대상이 아니어서 코멘트하지 않습니다."; exit 0 ;;
            *) echo "❌ 처리 결과를 만들지 못했습니다. Actions 로그를 확인하세요." > "$final" ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --body-file "$final"
          # 브랜치(또는 비교 링크)까지 만든 이슈에만 표식 라벨을 붙인다. 코멘트를 먼저 남기므로 라벨 실패가 알림을 막지 않는다.
          if [ "$status" = "ok" ] && { [ -s "$out/pr_url.txt" ] || [ -s "$out/compare_url.txt" ]; }; then
            gh issue edit "$ISSUE_NUMBER" --add-label "issue-edit-done"
          fi

      # 산출물(pr_body.md 등)에는 요청 원문이 들어 있어 그대로 cat 하면 `::warning::` 같은 줄이 워크플로 명령으로 해석된다.
      # 러너가 ::stop-commands::<무작위 토큰> 으로 감싸고, 줄마다 비밀 가림·명령 모양 무력화를 한 번 더 해서 출력한다.
      - name: DRY_RUN 결과 출력
        if: always() && env.DRY_RUN == 'true'
        run: python -m pipeline.edits.runner --show-output "${RUNNER_TEMP}/issue-edit"
