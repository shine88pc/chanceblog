name: "[공통] 저장소 규칙·테스트 자동 검사"

# 모든 변경(사람·AI 공통)에 대한 자동 점검: 비밀 유출, 워크플로 보안 규칙, 문서·설정 드리프트,
# 광고 표면 무단 변경, 단위 테스트, 워크플로 정적 분석. 설명: docs/ENGINEERING_GUIDE.md
#
# 언제 도나: push(어느 브랜치든) · 수동. PR(`pull_request`)로는 돌리지 않는다(운영자 요청 2026-11-04). PR 을 만들 때마다 같은 검사가 한 번 더 시작돼 화면에 '도는 중'(몇 분)이
# 보였고, 그 곁의 '건너뜀' 줄과 함께 '일부 검사가 안 돈다'로 읽혔다. 이제 검사는 브랜치를 push 한 그 커밋에서 이미 끝나 있어 PR 화면에는 끝난 초록(또는 빨강)만 보이고 바로 병합해도 된다.
# Copilot·사람이 만든 PR 도 그 브랜치의 push 로 검사된다(이 저장소의 브랜치. 포크에서 온 PR 은 이 저장소에 push 가 없어 이 검사가 돌지 않는다 — 이 저장소는 같은 저장소의 브랜치로 일한다).
# 검사 강도는 그대로다: main 이 아닌 브랜치 push 는 검증 전에 이 실행 안에서 origin/main 을 시험 병합해(러너 안에서만, 저장소에는 올리지 않는다) 'PR 의 병합 결과 트리'와 같은 모양에서
# 같은 검증·단위 테스트·actionlint 를 돈다. 봇이 main 에 글 커밋을 계속 올려서 push 한 브랜치의 트리와 병합 결과가 다를 수 있기 때문이다. main 과 충돌하면 이 검사가 실패한다.
# 병합 직후 main push 로 같은 검사가 한 번 더 돌고, 실패하면 아래 alert 잡이 휴대폰(텔레그램)으로 알린다.
# push 로 도는 워크플로는 push 한 커밋에 있는 이 파일 그대로 돈다(이 파일이 없는 옛 브랜치는 이 방식으로 검사되지 않는다).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 검사 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 검증 도구 설치
        run: python -m pip install -r requirements-dev.txt

      - name: 저장소 가드레일 검증
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # 브랜치 push(사전 검사): 가장 새 origin/main 을 이 실행 안에서 시험 병합해 'PR 의 병합 결과 트리'와 같은 모양을 검사한다. 병합 결과는 러너 안에만 있고 저장소에는 올리지 않는다
            # (push·원격 변경 없음, 임시 신원은 이 저장소 폴더의 로컬 설정에만 쓴다). 브랜치 이름 같은 이벤트 값은 어떤 명령에도 끼우지 않는다.
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            # 광고 표면 검사의 기준(--base)은 PR 검사(옛 PR_BASE)와 같은 뜻 — 시험 병합 직전의 origin/main 끝(sha)이다. 병합 결과 트리를 이 기준과 견주면 차이가 정확히 '이 브랜치가 바꾼 파일'이라
            # main 이 앞서 간 만큼(봇 글 커밋·다른 병합)이 오탐되지 않는다. 갈라진 지점(merge-base)이 아니다: 병합 결과 트리를 갈라진 지점과 견주면 main 쪽 변경까지 이 브랜치의 것으로 보인다.
            # 기준을 못 구하거나 병합이 안 되면 광고 표면 검사를 건너뛴 초록이 되지 않게 이 단계를 실패시킨다(AI 가 그 초록을 믿고 병합 부탁을 보내면 안 된다).
            if ! base="$(git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}')" || [ -z "$base" ]; then
              echo "::error::origin/main 의 끝을 구하지 못해 시험 병합과 광고 표면 검사를 할 수 없습니다 - 건너뛴 초록으로 두지 않고 실패시킵니다"
              exit 1
            fi
            git config user.name "guardrails-premerge"
            git config user.email "guardrails-premerge@users.noreply.github.com"
            if ! git merge --no-edit -m "guardrails: test merge of origin/main (not pushed)" origin/main; then
              echo "::error::새 main 과 충돌하거나 이어지지 않아 시험 병합을 하지 못했습니다 - 이 브랜치를 새 main 위에서 다시 만들어야 합니다(병합 결과 트리를 검사하지 못하므로 초록으로 두지 않고 실패시킵니다)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$base" HEAD; then
              echo "::error::시험 병합 결과가 origin/main 끝($base)을 담고 있지 않아 병합 결과 트리를 검사했다고 할 수 없습니다 - 실패시킵니다"
              exit 1
            fi
            echo "::notice title=광고 표면 검사 기준::시험 병합 직전의 main 끝 $base"
          else
            base="${PUSH_BASE:-}"
          fi
          if [ -n "$base" ]; then
            python scripts/validate_repo.py --base "$base"
          else
            python scripts/validate_repo.py
          fi

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: 워크플로 정적 분석 (actionlint)
        if: matrix.python-version == '3.12'
        run: actionlint

  # main 에 올라간 변경(직접 push·PR 병합)이 검사에 떨어지면 곧바로 휴대폰(텔레그램)으로 알린다(이슈 #90: 2026-10-31 main 에 직접 올라간 변경이 발행 프로그램을
  # 망가뜨렸는데 검사 실패는 GitHub 알림으로만 갔다). 병합 전 브랜치 검사(사전 검사)의 실패는 알리지 않는다 — PR 에 보이는 검사는 이미 끝난 결과라 병합 전에 빨강인지 알 수 있다.
  # 알림은 보조라 이 잡이 실패해도 검사 결과는 그대로다.
  # main 이 아닌 브랜치 push 의 실패도 알리지 않는다(AI 브랜치 `ai/claude/**` 의 사전 검사 포함): AI 가 먼저 고칠 일이고 운영자에게 넘기지 않는다. 이 잡은 push 한 커밋의 코드가
  # 텔레그램 시크릿과 함께 도는 잡이라 `github.ref` 가 main 일 때만 돌게 조건에 건다(조건을 풀면 브랜치 push 가 시크릿을 쓰는 길이 열린다).
  alert:
    name: 실패 알림(main 에 올라간 변경만)
    needs: validate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false      # 올라온 커밋의 코드가 텔레그램 시크릿과 함께 도는 잡이라 저장소 토큰을 남기지 않는다

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 텔레그램 알림(main 검사 실패)
        continue-on-error: true
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.notify main-check-failed
