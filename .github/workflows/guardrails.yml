name: 저장소 규칙·테스트 자동 검사

# 모든 변경(사람·AI 공통)에 대한 자동 점검: 비밀 유출, 워크플로 보안 규칙, 문서·설정 드리프트,
# 광고 표면 무단 변경, 단위 테스트, 워크플로 정적 분석. 설명: docs/ENGINEERING_GUIDE.md

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 검사 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 검증 도구 설치
        run: python -m pip install -r requirements-dev.txt

      - name: 저장소 가드레일 검증
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [ -n "$base" ]; then
            python scripts/validate_repo.py --base "$base"
          else
            python scripts/validate_repo.py
          fi

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: 워크플로 정적 분석 (actionlint)
        if: matrix.python-version == '3.12'
        run: actionlint
