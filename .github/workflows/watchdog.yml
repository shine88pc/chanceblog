name: "[공통] 발행 중단 감시·알림"
run-name: "[공통] 발행 중단 감시 · ${{ github.event_name == 'workflow_dispatch' && '수동' || '정기' }}"

# 풀오토가 조용히 멈추는 것을 막는다. 문제가 있을 때만 [Watchdog] 이슈를 열어(담당자 지정 + @멘션) 알리고,
# 풀릴 때까지 갱신·재알림하며, 해소되면 닫는다. 새로 생긴 심각 건이 있는 실행만 빨강으로 끝나 Actions 실패 알림도 간다.
# 판단 규칙: pipeline/health.py / 입출력: scripts/watchdog.py

on:
  schedule:
    # 하루 두 번: UTC 03:30(KST 12:30)과 UTC 15:30(KST 00:30). 예전에는 하루 한 번이라 기준을 넘은 뒤
    # 다음 점검까지 기다렸다. GitHub 스케줄은 보통 몇 시간 늦게 돈다(실측 약 5시간).
    - cron: '30 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: 발행 상태 점검
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 감시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # 운영자가 PIPELINE_PAUSE=true 로 일부러 멈춘 동안에는 알림을 만들지 않는다
          PIPELINE_PAUSE: ${{ vars.PIPELINE_PAUSE }}
        run: python scripts/watchdog.py
