name: "[공통] 병합완료 확인 알림 자동 보내기"

# 운영자가 `[M번호]` PR 을 병합해 main 에 들어오고 main 의 가드레일 검사가 끝나면, 운영자 휴대폰(텔레그램)으로 '[M번호] 병합완료 확인 - 정상' 또는 '- 이상'(사유 한 줄)을 자동으로 보낸다.
# 지금은 AI 가 병합 뒤에 직접 확인하고 같은 알림을 요청 파일로 보낸다 — 이 워크플로는 그것을 대신할 준비이고 **병합돼도 꺼진 채**다(켬 상태 파일 `pipeline/auto_notice.json`, 아래 첫 항목).
# 운영자가 읽는 설명: 인수인계/운영자_요청함_사용법.md '8.', 규칙: docs/SECURITY_GUARDRAILS.md G-A13·G-A14, 구조: docs/ARCHITECTURE.md §4-6-4, 계산·문장: pipeline/auto_notice.py.
# **이 워크플로는 병합하지 않는다.** 아무것도 쓰지 않는다(쓰기 권한 0 — 코멘트·라벨·병합·가지 삭제·재실행 호출이 없다). 읽기와 텔레그램 한 통뿐이다.
#
# 규칙(docs/SECURITY_GUARDRAILS.md G-A13·G-A14, tests/test_merge_notice_workflows.py 와 검증기 WF-16 이 고정한다):
#  - 트리거는 `workflow_run` 하나다 — `[공통] 저장소 규칙·테스트 자동 검사`(guardrails.yml)가 끝난 뒤, 가지 `main` 에서만(파이썬이 이벤트가 push 이고 이 저장소의 실행인지 다시 본다).
#    `workflow_run` 은 시크릿을 쥔 채 도는 위험한 트리거라 이 저장소에서는 이 파일과 `merge-ready-notice.yml` 둘에만 허용한다(검증기 WF-16). `pull_request_target`·`issue_comment`·`schedule`·`workflow_dispatch` 는 쓰지 않는다.
#  - **가지(PR 머리)의 코드는 내려받지도 실행하지도 않는다.** 체크아웃은 기본 가지의 코드만(`ref` 를 명시하고 `persist-credentials: false`), 실행하는 것은 기본 가지의 `pipeline/auto_notice.py` 뿐이다.
#  - 커밋 제목·PR 제목은 AI 가 쓴 글이다. `github.event.workflow_run.*` 값은 단계의 env 로만 넘기고 `run:` 에는 `${{ }}` 를 끼우지 않는다(검증기 WF-16 은 이 워크플로의 run 에 식을 하나도 허용하지 않는다).
#    문장에 들어가는 것은 검증한 `[M번호]` 와 고정 문장·정수뿐이고 제목 글은 싣지 않는다. 로그·요약에도 제목·본문 원문을 찍지 않는다.
#  - 권한은 contents·pull-requests·actions 읽기 셋뿐이다(쓰기 0). 시크릿은 텔레그램 둘뿐이고 **맨 끝 발송 단계의 env 로만** 넘긴다 — 앞 판정 단계에는 시크릿이 없고, 켬 상태가 `on` 이고 문장이 만들어졌을 때만
#    발송 단계가 돈다(`off`·`dry` 에서는 이 단계가 건너뛰어져 시크릿을 쓰지 않는다). 외부 액션은 이 저장소의 다른 워크플로가 쓰는 `actions/checkout`·`actions/setup-python` 뿐이다.
#  - 새 의존성이 없다(파이썬 표준 라이브러리). GitHub 읽기·텔레그램은 기존 클라이언트(운영자 요청함 접수 코드의 GitHub 클래스와 `notify.Notifier`)를 쓴다 — 새 외부 접속 코드는 없다.
#
# 알아 둘 것(한계):
#  - 켬 상태(`pipeline/auto_notice.json` 의 `mode`): `off`(기본 — 곧바로 끝, GitHub 도 텔레그램도 부르지 않는다)·`dry`(모든 계산을 하고 보낼 문장을 실행 요약에만 남김, 텔레그램 0)·`on`(발송).
#    파일을 못 읽거나 값이 이상하면 `off`. `dry` → `on` 으로 바꾸는 것은 별도 병합 부탁(T3)이다. 이 워크플로가 GitHub 에서 처음 도는 것은 병합 뒤이고 `off` 라 곧바로 끝난다 — 첫 관측은 `dry` 로 한다.
#    main 에 봇이 글을 올릴 때마다 이 워크플로도 한 번씩 돈다(커밋 제목이 `[M번호] ` 가 아니면 파이썬이 읽기 한 번 뒤 곧바로 끝낸다). 바뀐 켬 상태가 병합된 그 PR 자신의 확인부터 적용된다(코드와 켬 상태는 기본 가지의 최신 커밋).
#  - 보내는 때: main 에 들어온 커밋의 제목이 `[M번호] ` 로 시작하고 그 커밋에 연결된 병합된 PR 이 정확히 하나일 때뿐이다. 확인은 셋 — ① 병합 커밋의 부모 수(squash 는 1, 병합 커밋 방식의 2 도 허용하고 문장에 적는다)
#    ② 병합 커밋의 트리가 PR 머리 커밋의 트리와 같은지(같으면 '트리 일치', 다르면 main 이 앞서간 것이라 트리 비교를 빼고 변경 파일 수·이름 집합이 PR 과 같은지로 대신 확인) ③ 그 main 커밋의 가드레일 결론.
#    모두 문제 없으면 '- 정상', 아니면 '- 이상' 과 이유 한 줄. 검사가 취소되거나 건너뛰어졌으면(병합 직후 봇의 글 커밋이 검사를 취소하는 때) 판정을 미루고 보내지 않는다 — AI 의 요청 파일 알림이 병행한다.
#    연결된 PR 이 하나가 아니거나(직접 push 의 의심 포함) 변경 파일이 300개를 넘거나 GitHub 응답 하나가 2MB 를 넘으면 읽지 못해 보내지 않는다.
#  - 중복: 같은 병합 커밋의 실행은 한 줄로 세운다(concurrency 그룹을 커밋마다). 그래도 GitHub 화면에서 실행(이 워크플로나 main 의 검사)을 다시 돌리면(Re-run) 같은 알림이 한 번 더 간다. 쓰기 권한이 없어
#    '이미 보냈다' 표시를 남기지 못하므로 이 틈은 막지 못한다. 검사를 다시 돌려 이상이 정상으로 바뀌는 경우의 두 번째 알림은 의도한 것이다.
#  - 알림은 보조다 — 읽기·전송 실패는 경고 한 줄 뒤 성공으로 끝난다. 이 워크플로는 이 블로그 저장소 전용이다. 데스크톱 앱 저장소에는 텔레그램 시크릿이 없어 같은 알림을 만들지 않는다(설계만 같게 둔다).

on:
  workflow_run:
    workflows: ["[공통] 저장소 규칙·테스트 자동 검사"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: merge-confirm-notice-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    name: 병합완료 확인 판정과 발송
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 값은 한 줄도 `run:` 에 끼우지 않는다. 켬 상태가 off 면 파이썬이 한 줄 남기고 곧바로 끝난다. 시크릿은 이 단계에 없다.
      - name: 병합완료 확인 문장 만들기(켬 상태가 꺼짐이면 곧바로 끝)
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_RUN_ID: ${{ github.event.workflow_run.id }}
          NOTICE_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          NOTICE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          NOTICE_RUN_EVENT: ${{ github.event.workflow_run.event }}
          NOTICE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NOTICE_RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          NOTICE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m pipeline.auto_notice merge-confirm

      # 켬 상태가 on 이고 앞 단계가 문장을 만들었을 때만 돈다. 파이썬이 켬 상태와 문장을 한 번 더 검사한 뒤 보낸다.
      - name: 텔레그램으로 보내기(켬 상태가 on 일 때만)
        if: steps.decide.outputs.send == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.auto_notice send
