name: "[Blogger 영문] 글 자동 작성"
run-name: "[Blogger 영문] 글 작성 · ${{ github.event_name == 'workflow_dispatch' && (inputs.auth_check && '수동(인증 점검만: 글 안 만듦)' || inputs.dry_run && '수동(연습: 저장·게시 안 함)' || (inputs.publish == 'publish' && '수동(즉시 게시)' || (inputs.publish == 'off' && '수동(저장소 파일만 저장)' || '수동(Blogger 초안함 업로드)'))) || '정기' }}"

# 영문 Blogger(blogger_macat, macat0722) 전용 래퍼다. 글을 만드는 공용 로직은 blogger.yml(`[내부] Blogger 글 작성 공용`)에 있고, 이 파일은
# 영문 채널의 예약(cron)·수동 입력·동시 실행 줄·시크릿 이름만 갖고 한 블로그(`blog: blogger_macat`)만 돌린다. 한글 Blogger 는 blogger-ko.yml 이 따로 돈다.
# 정기·수동 판단(github.event_name·github.event.inputs)은 여기서 하고 결과를 `with:` 로 명시해 넘긴다 — 정기 실행은 연습 실행이 아니고 publish·인증 점검 입력을 쓰지 않는다.
# 워치독·확인 필요 모음은 레지스트리 workflow 필드(이 파일)로 '마지막 실행'을 찾는다: 재사용 워크플로를 부른 실행은 부른 쪽(이 파일) 아래에 기록된다.
# schedule.cron 은 레지스트리 값과 같아야 한다(scripts/validate_repo.py 가 확인). 래퍼가 레지스트리와 맞는지(key·시크릿 이름)는 같은 검증기의 REG-6 이 본다.

on:
  schedule:
    # KST 11:00 = UTC 02:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '직접 정할 주제 (비우면 자동 선택)'
        required: false
        type: string
      dry_run:
        description: '연습 실행(기본 켜짐): 가짜 AI 응답을 쓰고 Gemini를 호출하지 않으며, 파일 저장·게시·하루 상한 소진 없이 로그만 남깁니다. 체크를 풀면 실제 Gemini로 글을 만들어 초안을 저장소에 커밋하고 그날 하루 상한을 씁니다'
        type: boolean
        default: true
      publish:
        description: '글을 어디까지(연습 실행을 풀어야 적용): off=저장소 파일만 / draft=Blogger 초안함(기본) / publish=즉시 게시. 정기 실행은 mode를 따름. 자세히: BLOGGER_API_SETUP.md'
        type: choice
        default: 'draft'
        options:
          # 따옴표가 필요하다: 따옴표 없는 off 는 YAML 1.1 파서(PyYAML 등)가 문자열이 아니라 false 로 읽는다
          - 'off'
          - 'draft'
          - 'publish'
      auth_check:
        description: '인증 점검만 실행(기본 꺼짐): 글·Gemini 없이 토큰·블로그·주소만 확인(쓰기 없음). 자세히: BLOGGER_API_SETUP.md'
        type: boolean
        default: false

permissions:
  contents: read

# 같은 채널의 실행이 겹치지 않게 줄을 세운다. 공용 워크플로 안의 블로그별 줄(`blogger-<블로그 key>`)과 이름이 같으면 서로를 막으므로 다른 이름을 쓴다.
concurrency:
  group: blogger-en
  cancel-in-progress: false

jobs:
  blogger:
    name: 영문 Blogger 글 작성
    # 재사용 워크플로의 권한은 부르는 쪽이 정한 범위를 넘을 수 없다: 공용 워크플로의 generate 잡이 이력·초안을 커밋하려면 여기서 contents: write 를 줘야 한다(plan 잡은 contents: read 그대로)
    permissions:
      contents: write
    uses: ./.github/workflows/blogger.yml
    with:
      blog: blogger_macat
      topic: ${{ github.event.inputs.topic }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      publish: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || '' }}
      auth_check: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auth_check == 'true' }}
    # `secrets: inherit` 가 아니라 이 블로그의 시크릿 이름만 역할 이름으로 명시해 넘긴다(영문: BLOGGER_*)
    secrets:
      PIPELINE_SECRET_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIPELINE_SECRET_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      PIPELINE_SECRET_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      PIPELINE_SECRET_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      PIPELINE_SECRET_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
