name: "[공통] 확인 필요 모음"
run-name: "[공통] 확인 필요 모음 갱신 · ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '수동(연습: 이슈·코멘트 안 씀)' || '수동') || github.event_name == 'issues' && '이슈 변경(초안만 점검)' || github.event_name == 'pull_request' && 'PR 변경(초안만 점검)' || '정기' }}"

# 운영자가 해야 할 일·확인할 일(워치독 알림, 병합 대기 PR, 실패한 워크플로, 승인 대기 실행, 일시정지, Blogger 게시 설정, 채널별 초안 현황 등)을
# 이슈 1개('[운영] 확인 필요 모음')와 이 실행의 요약에 모은다. 새로 해야 할 일이 생기면 이슈에 코멘트(@멘션)로 알려 휴대폰 알림이 간다.
# 판단 규칙: pipeline/inbox.py / 입출력: scripts/ops_inbox.py / 설명: docs/OPS_INBOX.md
# 이 워크플로가 쓰는 것은 이슈·코멘트·라벨뿐이다(파일·브랜치는 바꾸지 않는다). 끄려면 Actions 탭에서 이 워크플로를 Disable 한다.
# 다른 워크플로의 이름에 기대지 않는다(workflow_run 트리거를 쓰지 않고 예약 시각마다 직접 조회한다).

on:
  schedule:
    # 2시간 간격(정각 혼잡을 피해 40분). GitHub 스케줄은 지연·누락될 수 있어 실제 간격은 더 길 수 있다.
    - cron: '40 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 실행 (이슈·코멘트를 쓰지 않고 실행 요약만 만듭니다)'
        type: boolean
        default: false
  # 초안(라벨 `초안`)이 붙은 이슈·PR 이 열리거나 닫히거나 다시 열리거나 라벨이 바뀔 때 곧바로 한 번 더 점검해 초안 현황을 거의 즉시 고친다.
  # 이벤트는 모든 이슈·PR 에서 오지만 아래 job 의 if 가 `초안` 라벨이 있는 것(또는 방금 `초안` 라벨을 뗀 것)만 통과시키고 나머지는 job 을 건너뛴다.
  # 주의: 저장소 기본 토큰(GITHUB_TOKEN)이 만들거나 고친 이슈·PR 은 이 이벤트를 일으키지 않는다(GitHub 의 규칙). 초안을 자동으로 만드는 워크플로는
  # 만든 뒤에 이 워크플로를 workflow_dispatch 로 직접 불러야 한다. 운영자가 휴대폰에서 닫거나 라벨을 바꾸는 것은 이벤트를 일으킨다.
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, labeled, unlabeled]

# 읽기: 코드(contents)·실행 기록(actions)·검사 결과와 주석(checks)·PR(pull-requests). 쓰기: 이슈(issues, 라벨 만들기 포함)뿐.
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  issues: write

jobs:
  inbox:
    name: 확인 필요 항목 모으기
    # 한 번에 하나만 돈다. 실행 중에 이벤트가 몰리면 기다리는 실행은 가장 새것 하나만 남는다(그 실행이 모두 다시 읽으므로 빠지는 것이 없다).
    # 일부러 워크플로 맨 위가 아니라 job 에 둔다: 맨 위에 두면 초안과 무관해 job 이 건너뛰어질 이벤트의 실행도 같은 줄에 서서,
    # 기다리던 진짜 갱신을 밀어낼 수 있다(job 의 if 가 거짓이면 이 job 은 줄에 서지 않는 것으로 알고 있다 — 병합 뒤 관측 필요).
    concurrency:
      group: ops-inbox
      cancel-in-progress: false
    # 예약·수동은 항상. 이슈·PR 이벤트는 `초안` 라벨이 있는 것(또는 방금 `초안` 라벨을 뗀 것)만 — PR 은 이 저장소의 브랜치에서 온 것만 한다
    # (포크 PR 의 토큰은 읽기 전용이라 이슈를 쓸 수 없고, 포크의 코드를 이 워크플로가 읽을 이유도 없다). 이벤트 값은 이 조건 안에서만 읽고 셸 명령에는 넣지 않는다.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.labels.*.name, '초안') || github.event.label.name == '초안')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, '초안') || github.event.label.name == '초안'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 이벤트에서는 PR 쪽 코드가 아니라 기본 브랜치의 코드로 점검한다(pr-scope-check.yml 과 같은 원칙). 다른 이벤트는 그 이벤트의 커밋(= 기본 동작)이다.
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # GITHUB_REPOSITORY·GITHUB_REPOSITORY_OWNER 는 러너가 기본으로 넣어 준다(스크립트가 그대로 읽는다).
      - name: 확인 필요 모음 갱신
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 킬 스위치 상태를 '지금 해야 할 일'로 보여 주려고 다른 워크플로와 같은 변수를 읽는다
          PIPELINE_PAUSE: ${{ vars.PIPELINE_PAUSE }}
          INBOX_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # 휴대폰(텔레그램) 알림: 두 시크릿이 모두 있을 때만, 코멘트를 쓰는 새 해야 할 일을 같은 요약으로 한 통 더 보낸다(없으면 아무 일도 없다)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ops_inbox.py
