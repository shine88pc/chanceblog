name: "AI 에게 새 일 맡기기(작업 요청)"
description: "AI 가 이어서 해 주었으면 하는 새 일을 적습니다. 올리면 접수 확인(코멘트와 텔레그램)이 오고, AI 세션이 이 이슈를 읽고 진행합니다. T3 승인은 아닙니다."
title: "[요청] "
labels: ["운영자요청"]
body:
  - type: markdown
    attributes:
      value: |
        **비밀번호·토큰·키 값은 절대 쓰지 마세요.** 이 이슈는 공개입니다(누구나 읽을 수 있습니다). 값이 필요한 일은 AI 가 안내하는 대로 GitHub 설정 화면에 직접 입력하세요.

        이 양식은 **저장소 소유자 계정으로 올린 것만** 접수됩니다. **이 양식은 T3 승인이 아닙니다** — 광고 표면·시크릿·계정·삭제·`mode` 변경·새 플랫폼 같은 T3 일이 필요하면 AI 가 번호 있는 `결정 부탁`(R-번호)으로 따로 묻고, 그때 `AI 요청에 답하기(결정·확인)` 양식으로 승인해 주세요.
        고정 페이지 문구나 게시글 이미지를 바꾸는 일은 `고정 페이지 수정`·`기존 게시글 이미지 변경` 양식을 쓰세요(자동으로 PR 이 만들어집니다).

  - type: textarea
    id: what
    attributes:
      label: "해 주었으면 하는 일"
      description: "무엇을 왜 하고 싶은지 쉬운 말로 적어 주세요. 길어도 됩니다."
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: "끝났다고 볼 기준"
      description: "(선택) 어떻게 되면 끝났다고 보는지 적어 주세요. 비워 두면 AI 가 제안합니다."
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: "긴급도"
      options:
        - "보통"
        - "급함"
        - "천천히"
      default: 0
    validations:
      required: false

  - type: dropdown
    id: approval
    attributes:
      label: "진행 범위"
      description: "AI 가 어디까지 진행할지 고릅니다. '구현·시험까지'는 위 내용을 만들고 시험하는 것까지(T1·T2)이고 T3(광고 표면·시크릿·계정·삭제·`mode` 변경·새 플랫폼 등)는 포함하지 않습니다. 모르겠으면 '논의·준비까지만'을 고르세요."
      options:
        - "논의·준비까지만"
        - "구현·시험까지 진행(T1·T2) — T3 는 따로 번호 있는 요청으로 묻습니다"
      default: 0
    validations:
      required: true
