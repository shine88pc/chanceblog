name: "Chance_Blog Control Center"
description: "AI 에이전트를 통해 블로그의 포스트, 디자인, 로고, 카테고리를 원격으로 제어합니다."
title: "[Control] "
labels: ["blog-control"]
body:
  - type: dropdown
  - id: action_type
    label: "작업 종류 선택"
    description: "어떤 작업을 수행하시겠습니까?"
    options:
      - "✨ 새로운 포스트 자동 생성 및 발행"
      - "🎨 디자인 / UI 스타일 변경"
      - "⚡ 로고 및 심볼 변경"
      - "📂 카테고리 구조 개편 및 추가"
      - "🛠️ 블로그 소스코드 / 설정 수정"
  - type: input
    id: category_name
    label: "카테고리 지정 (선택사항)"
    description: "특정 카테고리에만 적용할 경우 입력하세요 (예: KR - 테크 이야기)"
    options: []
    validations:
      required: false
  - type: textarea
    id: user_prompt
    label: "상세 내용 및 지시사항"
    description: "AI에게 요청할 내용을 자연어로 구체적으로 적어주세요."
    placeholder: "예시: 상단 헤더의 로고를 번개(⚡) 기호로 바꿔줘."
    validations:
      required: true
