name: "기존 게시글 이미지 변경"
description: "게시글 주소와 원하는 이미지 장면을 적으면 해당 글의 이미지만 바꾸는 PR 을 만듭니다. 검토 후 병합하면 반영됩니다."
title: "[이미지 변경] "
labels: ["blog-control", "edit:image"]
body:
  - type: markdown
    attributes:
      value: |
        이 양식은 **기존 게시글의 이미지 변경 전용**입니다.
        글 내용, 디자인, 코드, 설정 변경 요청은 자동으로 수정하지 않습니다.

  - type: input
    id: target_post
    attributes:
      label: "게시글 주소 또는 제목"
      description: "블로그에서 바꿀 게시글을 열고 주소창의 URL을 복사해 붙여 넣으세요. URL을 모르겠으면 게시글 제목을 그대로 입력해도 됩니다."
      placeholder: "예: https://shine88pc.github.io/chanceblog/... 또는 게시글 제목"
    validations:
      required: true

  - type: textarea
    id: user_prompt
    attributes:
      label: "원하는 이미지 설명"
      description: "이미지에 담길 장면을 구체적으로 적어주세요. 예: 소방관이 화재 현장에서 구조 활동을 하는 장면."
      placeholder: "예: 소방관 관련 글이므로 소방관의 구조 활동과 안전 장비가 잘 보이는 사진으로 바꿔주세요."
    validations:
      required: true
