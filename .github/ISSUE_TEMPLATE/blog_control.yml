name: Chance_Blog Control Center
description: 관리 도구를 사용하여 블로그를 제어합니다.
title: "[Control]: "
labels: ["blog-control"]
body:
  - type: dropdown
    id: action_type
    attributes:
      label: 작업 종류 선택
      options:
        - 새로운 포스트 직접 생성하기
        - 기존 포스트 수정 / 삭제하기
        - 블로그 코드 또는 설정 변경하기
  - type: dropdown
    id: category
    attributes:
      label: 카테고리 선택
      options:
        - IT / 테크
        - AI / 딥러닝
        - 일상 / 생각
        - 기타
  - type: textarea
    id: content
    attributes:
      label: 상세 내용 및 지시사항
      placeholder: AI에게 요청할 내용을 적어주세요.