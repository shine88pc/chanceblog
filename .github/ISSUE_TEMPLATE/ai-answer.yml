name: "AI 확인 요청에 답하기(대상번호)"
description: "텔레그램 확인 요청(맨 위의 숫자 001 같은 번호)에 답합니다. 대상번호만 올려도 접수됩니다(확인함 — 승인 아님). 선택·내용은 필요할 때만 쓰세요. 올리면 접수 확인(코멘트와 텔레그램)이 옵니다."
title: "[답변] "
labels: ["운영자응답"]
body:
  - type: markdown
    attributes:
      value: |
        **비밀번호·토큰·키 값은 절대 쓰지 마세요.** 이 이슈는 공개입니다(누구나 읽을 수 있습니다). 값이 필요한 일은 AI 가 안내하는 대로 GitHub 설정 화면에 직접 입력하세요.

        이 양식은 **저장소 소유자 계정으로 올린 것만** 접수됩니다. 대상번호는 텔레그램 확인 요청 맨 위의 `001` 같은 숫자입니다(번호 하나당 이슈 하나).
        **`선택 안 함` 이나 대상번호만 올린 답은 승인이 아닙니다** — '확인함' 으로만 접수됩니다. 승인은 그 확인 요청에 승인 보기로 적힌 번호를 아래 `선택` 에서 직접 고를 때만 인정되고, 그 요청에 적힌 항목에 한해서만 유효합니다.
        이미 답한 번호에 다시 올리면 가장 나중 답이 이깁니다. 옛 R 번호(`r149` 꼴) 요청에는 이 양식이 아니라 `AI 요청에 답하기(결정·확인) (이전 R 번호용)` 양식을 쓰세요.

  - type: input
    id: target
    attributes:
      label: "대상번호"
      description: "텔레그램 확인 요청 맨 위의 숫자를 그대로 쓰세요(예: 001). 번호는 하나만 쓰세요."
      placeholder: "001"
    validations:
      required: true

  - type: dropdown
    id: choice
    attributes:
      label: "선택"
      description: "요청에 보기(① ② …)가 있을 때만 그 기호를 고르세요. 고르지 않으면 `선택 안 함` 이고 확인함으로 접수됩니다."
      options:
        - "선택 안 함"
        - "①"
        - "②"
        - "③"
        - "④"
        - "⑤"
      default: 0
    validations:
      required: false

  - type: textarea
    id: memo
    attributes:
      label: "내용"
      description: "AI 에게 전할 말(선택). 화면에 보인 문구는 적어도 되지만 비밀번호·토큰·키 값은 쓰지 마세요."
    validations:
      required: false
